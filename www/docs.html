<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The NavPlace format: directives, sections, links, tags, images and search expressions.">
    <title>Format — NavPlace</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Crect width='29' height='29' rx='8' fill='%23286445'/%3E%3Cg transform='translate(5 5) scale(0.79)' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m5 19 4-14 10 10-14 4Z'/%3E%3Cpath d='m9 5 3 7 7 3M12 12l-7 7'/%3E%3C/g%3E%3C/svg%3E">
    <script>
        // Apply theme before paint to avoid flash
        (function () {
            try {
                const saved = localStorage.getItem('navplace.theme');
                const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            }
            catch {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <style>
        :root,
        [data-theme="light"] {
            --bg: #fafaf9;
            --panel: #ffffff;
            --border: #e7e5e4;
            --border-strong: #d6d3d1;
            --text: #1c1917;
            --text-soft: #57534e;
            --text-mute: #a8a29e;
            --accent: #0f766e;
            --accent-soft: #f0fdfa;
            --code-bg: #f5f5f4;
            --focus: 0 0 0 3px rgba(15, 118, 110, 0.18);
        }

        [data-theme="dark"] {
            --bg: #0c0c0e;
            --panel: #161618;
            --border: #27272a;
            --border-strong: #3f3f46;
            --text: #f4f4f5;
            --text-soft: #a1a1aa;
            --text-mute: #71717a;
            --accent: #2dd4bf;
            --accent-soft: #0f2926;
            --code-bg: #111113;
            --focus: 0 0 0 3px rgba(45, 212, 191, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        html {
            scroll-padding-top: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            transition: background-color 160ms ease, color 160ms ease;
        }

        a {
            transition: color 120ms ease;
            color: var(--text-soft);
            text-decoration: none;
        }
        a:hover {
            color: var(--text);
        }

        code, pre {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer;
            user-select: none;
        }
        button:focus-visible, a:focus-visible {
            outline: none;
            box-shadow: var(--focus);
        }

        .page {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 52px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text);
            font-weight: 720;
            font-size: 18px;
            letter-spacing: -0.6px;
        }
        .mark {
            display: grid;
            place-items: center;
            width: 29px;
            height: 29px;
            border-radius: 8px;
            color: #ffffff;
            background: #286445;
        }
        .topbar h1 {
            margin: 0 auto 0 0;
            color: var(--text-mute);
            font-size: 14px;
            font-weight: 500;
        }
        .topbar nav {
            display: flex;
            gap: 16px;
            font-size: 13px;
            white-space: nowrap;
        }
        .topbar nav [aria-current] {
            color: var(--text);
        }

        .theme {
            display: flex;
            padding: 2px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
        }
        .theme button {
            transition: color 120ms ease, background-color 120ms ease;
            display: grid;
            place-items: center;
            width: 26px;
            height: 22px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-mute);
        }
        .theme button:hover {
            color: var(--text);
        }
        .theme button[aria-pressed="true"] {
            color: var(--text);
            background: var(--code-bg);
        }

        /* ---------- Layout ---------- */
        .layout {
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr);
            gap: 40px;
            padding: 16px 0 48px;
        }
        .toc {
            position: sticky;
            top: 16px;
            align-self: start;
            font-size: 13px;
        }
        .toc h2 {
            margin: 0 0 6px;
            color: var(--text-mute);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .toc ul {
            margin: 0;
            padding: 0;
            list-style: none;
        }
        .toc a {
            display: block;
            padding: 3px 0;
        }
        .toc code {
            font-size: 12px;
        }

        /* ---------- Article ---------- */
        .docs {
            max-width: 760px;
            color: var(--text-soft);
        }
        .docs h1 {
            margin: 0 0 10px;
            color: var(--text);
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }
        .docs h2 {
            margin: 36px 0 8px;
            color: var(--text);
            font-size: 18px;
            letter-spacing: -0.01em;
        }
        .docs p, .docs ul {
            margin: 8px 0;
        }
        .docs ul {
            padding-left: 20px;
        }
        .docs a {
            color: var(--accent);
        }
        .docs code {
            padding: 1px 4px;
            border-radius: 4px;
            background: var(--code-bg);
            color: var(--text);
            font-size: 12.5px;
        }
        .docs pre {
            margin: 12px 0;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: auto;
            background: var(--code-bg);
        }
        .docs pre code {
            padding: 0;
            font-size: 12.5px;
        }
        .docs table {
            width: 100%;
            margin: 12px 0;
            border-collapse: collapse;
            font-size: 13px;
        }
        .docs th, .docs td {
            padding: 7px 12px 7px 0;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }
        .docs th {
            color: var(--text-mute);
            font-weight: 600;
        }
        .docs td:first-child code {
            white-space: nowrap;
        }

        @media (max-width: 800px) {
            .topbar h1 {
                display: none;
            }
            .brand {
                margin-right: auto;
            }
            .topbar nav a[href^="https:"] {
                display: none;
            }
            .layout {
                grid-template-columns: minmax(0, 1fr);
                gap: 16px;
            }
            .toc {
                position: static;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--border);
            }
            .docs table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>
<div class="page">

    <header class="topbar">
        <a class="brand" href="./" aria-label="NavPlace home">
            <span class="mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 19 4-14 10 10-14 4Z"/><path d="m9 5 3 7 7 3M12 12l-7 7"/></svg></span>
            NavPlace
        </a>
        <h1>Docs</h1>
        <nav aria-label="Main navigation">
            <a href="playground.html">Playground</a>
            <a href="docs.html" aria-current="page">Docs</a>
            <a href="https://github.com/vbarbarosh/navplace">GitHub <span aria-hidden="true">↗</span></a>
            <a href="https://github.com/vbarbarosh/navplace/releases/latest">Desktop app <span aria-hidden="true">↗</span></a>
        </nav>
        <div class="theme" role="group" aria-label="Theme">
            <button type="button" data-theme-value="light" title="Light" aria-label="Light">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <button type="button" data-theme-value="dark" title="Dark" aria-label="Dark">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
        </div>
    </header>

    <div class="layout">
        <nav class="toc" aria-label="Contents">
            <h2>Contents</h2>
            <ul></ul>
        </nav>
        <main>
            <article class="docs"></article>
        </main>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
<script>
main();

async function main()
{
    const docs = document.querySelector('.docs');
    const toc = document.querySelector('.toc ul');
    const base = 'https://github.com/vbarbarosh/navplace/blob/master/docs/';

    // Chrome on Wayland can hold a drag session and freeze the tab
    document.addEventListener('dragstart', v => v.preventDefault());

    for (const button of document.querySelectorAll('[data-theme-value]')) {
        button.addEventListener('click', () => save_theme(button.dataset.themeValue));
    }
    set_theme(document.documentElement.dataset.theme);

    try {
        const response = await fetch('docs/format.md');
        docs.innerHTML = marked.parse(await response.text());
    }
    catch {
        docs.innerHTML = `<h1>Format</h1><p>The reference did not load. Read it <a href="${base}format.md">on GitHub</a>.</p>`;
        return;
    }

    // Links between the markdown docs lead to GitHub, where the others live
    for (const link of docs.querySelectorAll('a[href]')) {
        if (!link.getAttribute('href').startsWith('#')) {
            link.href = new URL(link.getAttribute('href'), base);
            link.target = '_blank';
            link.rel = 'noopener';
        }
    }

    for (const heading of docs.querySelectorAll('h2')) {
        const item = document.createElement('li');
        const link = document.createElement('a');
        heading.id = format_slug(heading.textContent);
        link.href = `#${heading.id}`;
        link.innerHTML = heading.innerHTML;
        item.append(link);
        toc.append(item);
    }

    if (location.hash) {
        document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
    }
}

function set_theme(theme)
{
    document.documentElement.dataset.theme = theme;
    for (const button of document.querySelectorAll('[data-theme-value]')) {
        button.setAttribute('aria-pressed', String(button.dataset.themeValue === theme));
    }
}

function save_theme(theme)
{
    set_theme(theme);
    try {
        localStorage.setItem('navplace.theme', theme);
    }
    catch {
    }
}

function format_slug(text)
{
    return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
</script>

</body>
</html>
