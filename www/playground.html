<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Write a NavPlace collection in plain text, pick a design, and see it live.">
    <title>Playground — NavPlace</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 29 29'%3E%3Crect width='29' height='29' rx='8' fill='%23286445'/%3E%3Cg transform='translate(5 5) scale(0.79)' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m5 19 4-14 10 10-14 4Z'/%3E%3Cpath d='m9 5 3 7 7 3M12 12l-7 7'/%3E%3C/g%3E%3C/svg%3E">
    <script>
        // Apply theme before paint to avoid flash
        (function () {
            try {
                const saved = localStorage.getItem('navplace.theme');
                const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
                document.documentElement.dataset.theme = theme;
            }
            catch {
                document.documentElement.dataset.theme = 'light';
            }
        })();
    </script>
    <style>
        :root,
        [data-theme="light"] {
            --bg: #fafaf9;
            --panel: #ffffff;
            --border: #e7e5e4;
            --border-strong: #d6d3d1;
            --text: #1c1917;
            --text-soft: #57534e;
            --text-mute: #a8a29e;
            --accent: #0f766e;
            --accent-soft: #f0fdfa;
            --code-bg: #f5f5f4;
            --danger: #b91c1c;
            --focus: 0 0 0 3px rgba(15, 118, 110, 0.18);
        }

        [data-theme="dark"] {
            --bg: #0c0c0e;
            --panel: #161618;
            --border: #27272a;
            --border-strong: #3f3f46;
            --text: #f4f4f5;
            --text-soft: #a1a1aa;
            --text-mute: #71717a;
            --accent: #2dd4bf;
            --accent-soft: #0f2926;
            --code-bg: #111113;
            --danger: #f87171;
            --focus: 0 0 0 3px rgba(45, 212, 191, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            transition: background-color 160ms ease, color 160ms ease;
        }

        a {
            transition: color 120ms ease;
            color: var(--text-soft);
            text-decoration: none;
        }
        a:hover {
            color: var(--text);
        }

        code, pre, textarea {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        button, select {
            font: inherit;
            color: inherit;
        }
        button {
            cursor: pointer;
            user-select: none;
        }
        button:focus-visible, a:focus-visible, select:focus-visible {
            outline: none;
            box-shadow: var(--focus);
        }

        .app {
            display: grid;
            grid-template-rows: auto auto minmax(0, 1fr);
            height: 100vh;
            height: 100dvh;
            padding: 0 16px 16px;
        }

        /* ---------- Top bar ---------- */
        .topbar {
            margin: 0 -16px 12px;
            border-bottom: 1px solid var(--border);
        }

        /* The same column as the main page and the docs */
        .topbar-row {
            display: flex;
            align-items: center;
            gap: 20px;
            max-width: 1040px;
            height: 56px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--text);
            font-weight: 720;
            font-size: 18px;
            letter-spacing: -0.6px;
        }

        .mark {
            display: grid;
            place-items: center;
            width: 29px;
            height: 29px;
            border-radius: 8px;
            color: #ffffff;
            background: #286445;
        }

        .topbar nav {
            display: flex;
            gap: 18px;
            margin-left: auto;
            font-size: 14px;
            white-space: nowrap;
        }

        .topbar nav [aria-current] {
            color: var(--text);
            font-weight: 600;
        }

        .icon-link {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            padding: 0;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: var(--text-soft);
        }

        .icon-link:hover {
            color: var(--text);
        }

        .icon-link svg {
            width: 20px;
            height: 20px;
        }

        .theme-switch .moon,
        :root[data-theme="dark"] .theme-switch .sun {
            display: none;
        }

        :root[data-theme="dark"] .theme-switch .moon {
            display: block;
        }

        .topbar .ends {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0 10px;
        }
        .toolbar label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-soft);
            font-size: 12px;
        }
        .toolbar select {
            transition: border-color 120ms ease;
            height: 26px;
            padding: 0 6px;
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            background: var(--panel);
            font-size: 12px;
        }
        .toolbar select:hover {
            border-color: var(--text-mute);
        }
        .status {
            flex: 1;
            min-width: 0;
            margin: 0 0 0 8px;
            overflow: hidden;
            color: var(--text-mute);
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .status[data-error] {
            color: var(--danger);
        }

        .btn {
            transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            height: 26px;
            padding: 0 10px;
            border: 1px solid var(--border-strong);
            border-radius: 7px;
            background: var(--panel);
            color: var(--text);
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }
        .btn:hover {
            color: var(--text);
            border-color: var(--text-mute);
        }
        .btn[aria-pressed="true"] {
            border-color: var(--accent);
            background: var(--accent-soft);
            color: var(--accent);
        }
        .btn-primary {
            border-color: var(--accent);
            background: var(--accent);
            color: var(--bg);
        }
        .btn-primary:hover {
            color: var(--bg);
            border-color: var(--text);
            background: var(--text);
        }

        /* ---------- Work area ---------- */
        .work {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, var(--split, 40%)) 1px minmax(0, 1fr);
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            overflow: hidden;
        }
        .pane {
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        .pane-heading {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 6px 14px;
            border-bottom: 1px solid var(--border);
            color: var(--text-mute);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .pane-heading code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 400;
            letter-spacing: 0;
            text-transform: none;
        }
        .pane textarea {
            flex: 1;
            width: 100%;
            margin: 0;
            padding: 14px 16px;
            border: 0;
            overflow: auto;
            resize: none;
            white-space: pre;
            color: var(--text);
            background: var(--code-bg);
            font-size: 13px;
            line-height: 1.6;
        }
        .pane textarea:focus {
            outline: none;
        }
        .pane iframe {
            flex: 1;
            width: 100%;
            border: 0;
            background: #ffffff;
        }

        /* ---------- Divider ---------- */
        .divider {
            transition: background-color 120ms ease;
            position: relative;
            z-index: 1;
            background: var(--border);
            cursor: col-resize;
            touch-action: none;
        }
        .divider::before {
            content: "";
            position: absolute;
            inset: 0 -5px;
        }
        .divider:hover, .work[data-dragging] .divider {
            background: var(--accent);
        }
        .divider:focus-visible {
            outline: none;
            background: var(--accent);
            box-shadow: var(--focus);
        }
        .work[data-dragging] {
            cursor: col-resize;
            user-select: none;
        }
        .work[data-dragging] iframe {
            pointer-events: none;
        }

        @media (max-width: 720px) {
            .app {
                display: block;
                height: auto;
            }
            .topbar nav .wide {
                display: none;
            }
            .toolbar {
                flex-wrap: wrap;
            }
            .status {
                flex-basis: 100%;
                order: 1;
                margin: 0;
            }
            .work {
                grid-template-columns: minmax(0, 1fr);
                grid-template-rows: 45vh 70vh;
            }
            .divider {
                display: none;
            }
            .pane-preview {
                border-top: 1px solid var(--border);
            }
            .pane textarea {
                padding: 12px 14px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
<div class="app">

    <header class="topbar">
        <div class="topbar-row">
            <a class="brand" href="./" aria-label="NavPlace home">
                <span class="mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 19 4-14 10 10-14 4Z"/><path d="m9 5 3 7 7 3M12 12l-7 7"/></svg></span>
                NavPlace

            </nav>
            <div class="ends">
                <a class="icon-link" href="https://github.com/vbarbarosh/navplace" title="NavPlace on GitHub" aria-label="NavPlace on GitHub">
                    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.08 3.29 9.39 7.86 10.91.58.11.79-.25.79-.56v-1.97c-3.2.7-3.87-1.54-3.87-1.54-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.15.08 1.76 1.18 1.76 1.18 1.03 1.76 2.69 1.25 3.35.96.1-.74.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.68 0-1.26.45-2.28 1.18-3.09-.12-.29-.51-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.81 1.18 1.83 1.18 3.09 0 4.41-2.69 5.38-5.25 5.67.41.36.78 1.06.78 2.14v3.17c0 .31.21.68.8.56A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5Z"/></svg>
                </a>
                <button class="icon-link theme-switch" type="button" title="Switch theme" aria-label="Switch theme">
                    <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12,9c1.65,0,3,1.35,3,3s-1.35,3-3,3s-3-1.35-3-3S10.35,9,12,9 M12,7c-2.76,0-5,2.24-5,5s2.24,5,5,5s5-2.24,5-5 S14.76,7,12,7L12,7z M2,13l2,0c0.55,0,1-0.45,1-1s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S1.45,13,2,13z M20,13l2,0c0.55,0,1-0.45,1-1 s-0.45-1-1-1l-2,0c-0.55,0-1,0.45-1,1S19.45,13,20,13z M11,2v2c0,0.55,0.45,1,1,1s1-0.45,1-1V2c0-0.55-0.45-1-1-1S11,1.45,11,2z M11,20v2c0,0.55,0.45,1,1,1s1-0.45,1-1v-2c0-0.55-0.45-1-1-1C11.45,19,11,19.45,11,20z M5.99,4.58c-0.39-0.39-1.03-0.39-1.41,0 c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0s0.39-1.03,0-1.41L5.99,4.58z M18.36,16.95 c-0.39-0.39-1.03-0.39-1.41,0c-0.39,0.39-0.39,1.03,0,1.41l1.06,1.06c0.39,0.39,1.03,0.39,1.41,0c0.39-0.39,0.39-1.03,0-1.41 L18.36,16.95z M19.42,5.99c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06c-0.39,0.39-0.39,1.03,0,1.41 s1.03,0.39,1.41,0L19.42,5.99z M7.05,18.36c0.39-0.39,0.39-1.03,0-1.41c-0.39-0.39-1.03-0.39-1.41,0l-1.06,1.06 c-0.39,0.39-0.39,1.03,0,1.41s1.03,0.39,1.41,0L7.05,18.36z"/></svg>
                    <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.37,5.51C9.19,6.15,9.1,6.82,9.1,7.5c0,4.08,3.32,7.4,7.4,7.4c0.68,0,1.35-0.09,1.99-0.27C17.45,17.19,14.93,19,12,19 c-3.86,0-7-3.14-7-7C5,9.07,6.81,6.55,9.37,5.51z M12,3c-4.97,0-9,4.03-9,9s4.03,9,9,9s9-4.03,9-9c0-0.46-0.04-0.92-0.1-1.36 c-0.98,1.37-2.58,2.26-4.4,2.26c-2.98,0-5.4-2.42-5.4-5.4c0-1.81,0.89-3.42,2.26-4.4C12.92,3.04,12.46,3,12,3L12,3z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="toolbar">
        <label>Design <select aria-label="Design"></select></label>
        <button class="btn" type="button" data-action="reset" title="Replace the text with the sample for this design">Reset</button>
        <p class="status" role="status"></p>
        <button class="btn" type="button" data-action="copy">Copy embed</button>
        <button class="btn btn-primary" type="button" data-action="codepen">Open in CodePen <span aria-hidden="true">↗</span></button>
    </div>

    <main class="work">
        <section class="pane pane-editor" id="editor-pane" aria-label="Source">
            <div class="pane-heading"><code>links.txt</code></div>

        </section>
        <div class="divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize panels" aria-controls="editor-pane" aria-valuemin="0" aria-valuemax="100" title="Drag to resize, double-click to reset"></div>

</div>

<script src="lib/parse.js"></script>
<script>
const default_split = 0.4;

main();

async function main()
{
    const work = document.querySelector('.work');
    const editor = document.querySelector('.pane-editor textarea');
    const frame = document.querySelector('.pane-preview iframe');
    const design_select = document.querySelector('.toolbar select');
    const status = document.querySelector('.status');
    const divider = document.querySelector('.divider');
    const copy_button = document.querySelector('[data-action="copy"]');
    let designs = null;
    let frame_design = null;
    let frame_ready = false;
    let refocus = false;
    let render_timer;
    let split = load_split() ?? default_split;
    let sample_request = null;
    let copy_timer;

    // Chrome on Wayland can hold a drag session and freeze the tab
    document.addEventListener('dragstart', v => v.preventDefault());

    document.querySelector('.theme-switch').addEventListener('click', function () {
        save_theme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });

    editor.addEventListener('input', function () {
        save_draft(editor.value);
        clearTimeout(render_timer);
        render_timer = setTimeout(render, 300);
    });
    // Picking a design loads its sample; without one, only the design line changes
    design_select.addEventListener('change', async function () {
        const design = design_select.value;
        const sample = await load_sample(design);
        if (sample !== undefined) {
            replace_text(sample ?? format_design(editor.value, design));
        }
    });
    document.querySelector('[data-action="reset"]').addEventListener('click', async function () {
        const sample = await load_sample(frame_design ?? 'showcase');
        if (typeof sample === 'string') {
            replace_text(sample);
        }
    });
    copy_button.addEventListener('click', copy);
    document.querySelector('[data-action="codepen"]').addEventListener('click', () => open_codepen(format_snippet(editor.value.trim())));

    // A design says it is ready on every load; it gets the text in reply
    window.addEventListener('message', function (event) {
        if (event.source !== frame.contentWindow || event.data?.type !== 'navplace:ready') {
            return;
        }
        frame_ready = true;
        post_text();
    });
    // A design focuses its own search box on load; typing keeps going in the editor
    frame.addEventListener('load', function () {
        if (refocus) {
            editor.focus();
        }
    });

    divider.addEventListener('pointerdown', function (event) {
        if (event.button !== 0) {
            return;
        }
        event.preventDefault();
        divider.setPointerCapture(event.pointerId);
        work.toggleAttribute('data-dragging', true);
    });
    divider.addEventListener('pointermove', function (event) {
        if (divider.hasPointerCapture(event.pointerId)) {
            const rect = work.getBoundingClientRect();
            split = clamp_split((event.clientX - rect.left) / rect.width);
            render_split();
        }
    });
    divider.addEventListener('lostpointercapture', function () {
        work.toggleAttribute('data-dragging', false);
        save_split(split);
    });
    divider.addEventListener('keydown', function (event) {
        const step = event.shiftKey ? 0.1 : 0.02;
        if (event.key === 'ArrowLeft') {
            split = clamp_split(split - step);
        }
        else if (event.key === 'ArrowRight') {
            split = clamp_split(split + step);
        }
        else {
            return;
        }
        event.preventDefault();
        render_split();
        save_split(split);
    });
    divider.addEventListener('dblclick', function () {
        split = default_split;
        render_split();
        save_split(null);
    });
    window.addEventListener('resize', render_split);

    render_split();
    editor.value = load_draft() ?? await load_sample('showcase') ?? '';
    render();
    load_designs();

    function render() {
        let parsed;
        try {
            parsed = parse(editor.value);
        }
        catch (error) {
            status.textContent = `${error.message}. The preview shows the last text that parsed.`;
            status.dataset.error = '';
            return;
        }
        const design = parsed.meta.design || 'basic';
        design_select.value = design;
        // A half-typed name would load a missing page
        if (designs && !designs.includes(design)) {
            status.textContent = `No design named "${design}". The preview shows the last design that exists.`;
            status.dataset.error = '';
            return;
        }
        status.textContent = `${parsed.items.length} ${parsed.items.length === 1 ? 'link' : 'links'}`;
        delete status.dataset.error;
        if (design !== frame_design) {
            frame_design = design;
            frame_ready = false;
            refocus = (document.activeElement === editor);
            frame.src = `designs/${encodeURIComponent(design)}/index.html`;
        }
        else if (frame_ready) {
            post_text();
        }
    }

    // null when the design has no sample; undefined when a later pick took over
    async function load_sample(design) {
        const request = sample_request = {};
        try {
            const response = await fetch(`designs/${encodeURIComponent(design)}/links.txt`);
            const text = response.ok ? (await response.text()).trim() : null;
            return (request === sample_request) ? text : undefined;
        }
        catch {
            return null;
        }
    }

    // Through the editing commands, so Ctrl+Z brings the previous text back
    function replace_text(text) {
        editor.focus();
        editor.select();
        if (!document.execCommand('insertText', false, text)) {
            editor.value = text;
        }
        editor.setSelectionRange(0, 0);
        editor.scrollTop = 0;
        save_draft(editor.value);
        clearTimeout(render_timer);
        render();
    }

    function post_text() {
        frame.contentWindow.postMessage({type: 'navplace:items-text', text: editor.value}, '*');
    }

    // A narrow window squeezes the split without forgetting it
    function render_split() {
        const value = clamp_split(split);
        work.style.setProperty('--split', `${(value * 100).toFixed(2)}%`);
        divider.setAttribute('aria-valuenow', String(Math.round(value * 100)));
    }

    // Each pane keeps a usable width
    function clamp_split(value) {
        const min = 240 / work.clientWidth;
        const max = 1 - 320 / work.clientWidth;
        return (min < max) ? Math.min(max, Math.max(min, value)) : 0.5;
    }

    async function load_designs() {
        try {
            const response = await fetch('designs/index.json');
            const options = await response.json();
            for (const option of options) {
                design_select.append(new Option(option.label, option.value));
            }
            designs = options.map(v => v.value);
            render();
        }
        catch {
            design_select.disabled = true;
        }
    }

    async function copy() {
        try {
            await navigator.clipboard.writeText(format_snippet(editor.value.trim()));
            copy_button.textContent = 'Copied!';
            clearTimeout(copy_timer);
            copy_timer = setTimeout(() => copy_button.textContent = 'Copy embed', 2000);
        }
        catch {
            status.textContent = 'Copy unavailable. Open in CodePen to get the embed code.';
        }
    }
}

function save_theme(theme)
{
    document.documentElement.dataset.theme = theme;
    try {
        localStorage.setItem('navplace.theme', theme);
    }
    catch {
    }
}

function load_draft()
{
    try {
        return localStorage.getItem('navplace.playground');
    }
    catch {
        return null;
    }
}

function load_split()
{
    try {
        const value = parseFloat(localStorage.getItem('navplace.playground.split'));
        return Number.isFinite(value) ? value : null;
    }
    catch {
        return null;
    }
}

function save_split(value)
{
    try {
        if (value === null) {
            localStorage.removeItem('navplace.playground.split');
        }
        else {
            localStorage.setItem('navplace.playground.split', String(value));
        }
    }
    catch {
    }
}

function save_draft(text)
{
    try {
        localStorage.setItem('navplace.playground', text);
    }
    catch {
    }
}

// Rewrites the last `% design:` line, the one the parser keeps
function format_design(links, design)
{
    const lines = links.split('\n');
    const i = lines.findLastIndex(v => /^\s*%\s*design\s*:/.test(v));
    if (i === -1) {
        return `% design: ${design}\n${links}`;
    }
    lines[i] = `% design: ${design}`;
    return lines.join('\n');
}

function format_snippet(links)
{
    const attr = links.replaceAll('&', '&amp;').replaceAll('"', '&quot;');
    return `<div style="position:fixed;inset:0;">\n<script src="https://navplace.com/lib/embed.js" data-links="\n${attr}\n"><\/script>\n</div>\n`;
}

function open_codepen(html)
{
    const form = document.createElement('form');
    const input = document.createElement('input');
    form.action = 'https://codepen.io/pen/define';
    form.method = 'POST';
    form.target = '_blank';
    input.type = 'hidden';
    input.name = 'data';
    input.value = JSON.stringify({title: 'NavPlace collection', html, css: '', js: ''});
    form.append(input);
    document.body.append(form);
    form.submit();
    form.remove();
}
