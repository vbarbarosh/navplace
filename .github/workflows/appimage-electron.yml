name: Electron AppImage

on:
  push:
    branches:
      - master
    tags:
      - 'electron-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The token is given only to the step that publishes a release
          persist-credentials: false

      - name: Plan build
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/master)
              short_sha=${GITHUB_SHA::7}
              timestamp=$(date -u +%Y%m%d_%H%M%S)
              master_version="master-${timestamp}-${short_sha}"

              # A release pushes master and its tag: the tag's own run builds that commit, once
              if [[ "$(git log -1 --format=%s)" == "release: electron-v"* ]]; then
                echo "build=false" >> "$GITHUB_OUTPUT"
              else
                echo "build=true" >> "$GITHUB_OUTPUT"
              fi
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "master_version=$master_version" >> "$GITHUB_OUTPUT"
              # What the app shows as its version: the last release's number, a plus sign, this build
              echo "master_build=master.${timestamp/_/}.${short_sha}" >> "$GITHUB_OUTPUT"
              echo "artifact_name=NavPlace-Electron-${master_version}-AppImage" >> "$GITHUB_OUTPUT"
              ;;

            refs/tags/electron-v*)
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "release=true" >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Node
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/desktop-electron/package-lock.json

      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        working-directory: src/desktop-electron
        run: npm ci

      # lib/ and designs/ go into the AppImage: their tests run too
      - name: Install the site's dependencies
        if: steps.plan.outputs.build == 'true'
        run: npm ci

      - name: Test the shared code
        if: steps.plan.outputs.build == 'true'
        run: bin/test

      - name: Test
        if: steps.plan.outputs.build == 'true'
        run: src/desktop-electron/bin/test

      # A build of master is not the release it follows: its title and its check for updates say so
      - name: Mark a master build in its version
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.release != 'true'
        working-directory: src/desktop-electron
        env:
          MASTER_BUILD: ${{ steps.plan.outputs.master_build }}
        run: |
          node -e '
              const fs = require("fs");
              const package = JSON.parse(fs.readFileSync("package.json", "utf8"));
              package.version = `${package.version}+${process.env.MASTER_BUILD}`;
              fs.writeFileSync("package.json", `${JSON.stringify(package, null, 2)}\n`);
              console.log(package.version);
          '

      - name: Build AppImage
        if: steps.plan.outputs.build == 'true'
        run: src/desktop-electron/bin/build

      - name: Name master AppImage
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.release != 'true'
        id: master_appimage
        shell: bash
        env:
          MASTER_VERSION: ${{ steps.plan.outputs.master_version }}
        run: |
          set -euo pipefail

          appimage=$(find src/desktop-electron/build -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          renamed="src/desktop-electron/build/NavPlace-Electron-${MASTER_VERSION}.AppImage"

          cp -p "$appimage" "$renamed"
          echo "path=$renamed" >> "$GITHUB_OUTPUT"

      - name: Upload master AppImage artifact
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.release != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: ${{ steps.master_appimage.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage to release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "release $GITHUB_REF_NAME"
          fi

          gh release upload "$GITHUB_REF_NAME" src/desktop-electron/build/*.AppImage --clobber
