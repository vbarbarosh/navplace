name: Electron AppImage

on:
  push:
    branches:
      - master
    tags:
      - 'electron-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan build
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/heads/master)
              short_sha=${GITHUB_SHA::7}
              timestamp=$(date -u +%Y%m%d_%H%M%S)
              master_version="master-${timestamp}-${short_sha}"

              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "master_version=$master_version" >> "$GITHUB_OUTPUT"
              echo "artifact_name=NavPlace-Electron-${master_version}-AppImage" >> "$GITHUB_OUTPUT"
              ;;

            refs/tags/electron-v*)
              tag_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
              git fetch --no-tags origin production:refs/remotes/origin/production

              if git merge-base --is-ancestor "$tag_commit" origin/production; then
                echo "build=true" >> "$GITHUB_OUTPUT"
                echo "release=true" >> "$GITHUB_OUTPUT"
              else
                echo "build=false" >> "$GITHUB_OUTPUT"
                echo "release=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Skipping AppImage build because $GITHUB_REF_NAME is not on origin/production."
              fi
              ;;

            *)
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "release=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Setup Node
        if: steps.plan.outputs.build == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/desktop-electron/package-lock.json

      - name: Install dependencies
        if: steps.plan.outputs.build == 'true'
        working-directory: src/desktop-electron
        run: npm ci

      - name: Test
        if: steps.plan.outputs.build == 'true'
        working-directory: src/desktop-electron
        run: npm test

      - name: Prepare bundled static directory
        if: steps.plan.outputs.build == 'true'
        run: mkdir -p src/desktop-electron/static/unpkg

      - name: Build AppImage
        if: steps.plan.outputs.build == 'true'
        run: src/desktop-electron/bin/build

      - name: Name master AppImage
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.release != 'true'
        id: master_appimage
        shell: bash
        env:
          MASTER_VERSION: ${{ steps.plan.outputs.master_version }}
        run: |
          set -euo pipefail

          appimage=$(find src/desktop-electron/build -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          renamed="src/desktop-electron/build/NavPlace-Electron-${MASTER_VERSION}.AppImage"

          cp -p "$appimage" "$renamed"
          echo "path=$renamed" >> "$GITHUB_OUTPUT"

      - name: Upload master AppImage artifact
        if: steps.plan.outputs.build == 'true' && steps.plan.outputs.release != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: ${{ steps.master_appimage.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload AppImage to release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "release $GITHUB_REF_NAME"
          fi

          gh release upload "$GITHUB_REF_NAME" src/desktop-electron/build/*.AppImage --clobber
