name: Deno AppImage

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan build
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          short_sha=${GITHUB_SHA::7}
          timestamp=$(date -u +%Y%m%d_%H%M%S)
          master_version="master-${timestamp}-${short_sha}"

          echo "master_version=$master_version" >> "$GITHUB_OUTPUT"
          echo "artifact_name=NavPlace-Deno-${master_version}-AppImage" >> "$GITHUB_OUTPUT"

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Build AppImage
        run: src/desktop-deno.ai/bin/build

      - name: Name master AppImage
        id: master_appimage
        shell: bash
        env:
          MASTER_VERSION: ${{ steps.plan.outputs.master_version }}
        run: |
          set -euo pipefail

          appimage=$(find src/desktop-deno.ai/build -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          renamed="src/desktop-deno.ai/build/NavPlace-Deno-${MASTER_VERSION}.AppImage"

          cp -p "$appimage" "$renamed"
          echo "path=$renamed" >> "$GITHUB_OUTPUT"

      - name: Upload master AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: ${{ steps.master_appimage.outputs.path }}
          if-no-files-found: error
          retention-days: 30
