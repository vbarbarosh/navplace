<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPlace Kids Theme</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        /* Light on :root, dark (a night sky) on :root[data-theme="dark"]: /lib/theme_switch.js sets it */
        :root {
            --page-bg: #f0f8ff;
            --text: #333;
            --search-bg: #ffffff;
            --search-fg: #333;
            --search-border: #87ceeb;
            --placeholder: #757575;
            --card-1: #b0e57c;
            --card-2: #ffd700;
            --card-3: #87cefa;
            --picture-ring: #ffffff;
            --np-switch-border: #87ceeb;
            --np-scrollbar-thumb: #87ceeb;
            --np-scrollbar-track: #f0f8ff;
            --current-ring: #ff8c00;
        }

        :root[data-theme="dark"] {
            --page-bg: #14213d;
            --text: #fff8dc;
            --search-bg: #1d2d52;
            --search-fg: #fff8dc;
            --search-border: #5fa8d3;
            --placeholder: #8fa3c4;
            --card-1: #3e6b2c;
            --card-2: #806414;
            --card-3: #2c5d86;
            --picture-ring: #fff8dc;
            --np-switch-bg: #1d2d52;
            --np-switch-border: #5fa8d3;
            --np-scrollbar-thumb: #3d6a8f;
            --np-scrollbar-track: #14213d;
            --current-ring: #ffd700;
        }

        body {
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background-color: var(--page-bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #search {
            width: 80%;
            max-width: 600px;
            padding: 15px;
            font-size: 24px;
            border: 2px solid var(--search-border);
            border-radius: 30px;
            background: var(--search-bg);
            color: var(--search-fg);
            margin-bottom: 30px;
            outline: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* The placeholder is never cut: on a narrow screen it shrinks as the box does. 4.4vw keeps
           its 25 characters inside the box, 80% of the page wide, down to 320px */
        #search::placeholder {
            color: var(--placeholder);
            font-size: min(1em, 4.4vw);
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fffacd;
            border-radius: 30px;
            text-decoration: none;
            color: var(--text);
            font-size: 24px;
            text-align: center;
            /* A long name stays in its card: a word with no spaces breaks where the line ends */
            overflow-wrap: anywhere;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        /* The link ↑ and ↓ chose (lib/navplace.js); Enter opens it */
        .card.np-current {
            outline: 5px solid var(--current-ring);
            outline-offset: 4px;
            transform: scale(1.05);
        }

        .card img,
        .card .letter {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
            border: 3px solid var(--picture-ring);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* In place of an icon that did not load: the link's first letter in the same round frame */
        .card .letter {
            background: var(--search-bg);
            color: var(--search-fg);
            font-size: 60px;
            line-height: 120px;
        }

        .card:nth-child(3n+1) {
            background-color: var(--card-1);
        }

        .card:nth-child(3n+2) {
            background-color: var(--card-2);
        }

        .card:nth-child(3n+3) {
            background-color: var(--card-3);
        }

        /* In place of the cards when there are none: one line across the columns */
        .empty-note {
            grid-column: 1 / -1;
            margin: 0;
            font-size: 24px;
            text-align: center;
        }
    </style>
</head>
<body>
<input type="search" id="search" placeholder="What are you looking for?" aria-label="What are you looking for?">
<div id="results"></div>
<script src="/lib/navplace.js"></script>
<script>
    const input = document.getElementById('search');
    const container = document.getElementById('results');
    // Pictures and icons that did not load, by address: a card shows the site's icon in place of
    // its picture, and the link's first letter in place of the icon
    const failed_urls = new Set();

    main();

    function main()
    {
        navplace({input, update: refresh_results});
    }

    // `current`: the link ↑ and ↓ chose (lib/navplace.js), the one Enter opens
    function refresh_results(items, {current = 0} = {})
    {
        container.innerHTML = '';
        for (const [i, item] of items.entries()) {
            const card = document.createElement('a');
            card.href = item.href;
            card.className = (i === current) ? 'card np-current' : 'card';
            // A click opens through the runtime: every selected link, this one in place of the last
            card.addEventListener('click', function (event) {
                navplace.navigate(item, event);
            });
            card.appendChild(make_picture(item));
            const label = document.createElement('span');
            label.textContent = item.label;
            card.appendChild(label);
            container.appendChild(card);
        }
        // No cards: a line says why, nothing matches the search or there are no links at all
        if (!items.length) {
            const note = document.createElement('p');
            note.className = 'empty-note';
            note.textContent = input.value.trim() ? 'Nothing found' : 'No links yet';
            container.appendChild(note);
        }
    }

    // The round picture of a card: the link's picture, the site's icon when there is none or it
    // did not load, the link's first letter when the icon did not load either
    function make_picture(item)
    {
        const url = [item.image_url, item.icon_url].find(v => v && !failed_urls.has(v));
        if (!url) {
            return make_letter(item);
        }
        const out = document.createElement('img');
        out.src = url;
        out.alt = item.label;
        out.addEventListener('error', function () {
            failed_urls.add(url);
            out.replaceWith(make_picture(item));
        });
        return out;
    }

    // In place of the picture: the first letter or digit of the link's name, as lib/parse.js
    // picks it for its own tile
    function make_letter(item)
    {
        const out = document.createElement('span');
        out.className = 'letter';
        out.textContent = item.label.match(/[\p{L}\p{N}]/u)?.[0].toUpperCase() ?? '?';
        return out;
    }
</script>
</body>
</html>
