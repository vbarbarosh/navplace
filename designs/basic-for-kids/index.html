<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPlace Kids Theme</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        /* Light on :root, dark (a night sky) on :root[data-theme="dark"]: /lib/theme_switch.js sets it */
        :root {
            --page-bg: #f0f8ff;
            --text: #333;
            --search-bg: #ffffff;
            --search-fg: #333;
            --search-border: #87ceeb;
            --placeholder: #a9a9a9;
            --card-1: #b0e57c;
            --card-2: #ffd700;
            --card-3: #87cefa;
            --picture-ring: #ffffff;
            --np-switch-border: #87ceeb;
            --np-scrollbar-thumb: #87ceeb;
            --np-scrollbar-track: #f0f8ff;
        }

        :root[data-theme="dark"] {
            --page-bg: #14213d;
            --text: #fff8dc;
            --search-bg: #1d2d52;
            --search-fg: #fff8dc;
            --search-border: #5fa8d3;
            --placeholder: #8fa3c4;
            --card-1: #3e6b2c;
            --card-2: #806414;
            --card-3: #2c5d86;
            --picture-ring: #fff8dc;
            --np-switch-bg: #1d2d52;
            --np-switch-border: #5fa8d3;
            --np-scrollbar-thumb: #3d6a8f;
            --np-scrollbar-track: #14213d;
        }

        body {
            font-family: 'Comic Sans MS', Arial, sans-serif;
            background-color: var(--page-bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #search {
            width: 80%;
            max-width: 600px;
            padding: 15px;
            font-size: 24px;
            border: 2px solid var(--search-border);
            border-radius: 30px;
            background: var(--search-bg);
            color: var(--search-fg);
            margin-bottom: 30px;
            outline: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        #search::placeholder {
            color: var(--placeholder);
        }

        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 30px;
            width: 90%;
            max-width: 1200px;
        }

        .card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #fffacd;
            border-radius: 30px;
            text-decoration: none;
            color: var(--text);
            font-size: 24px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
            object-fit: cover;
            border: 3px solid var(--picture-ring);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .card:nth-child(3n+1) {
            background-color: var(--card-1);
        }

        .card:nth-child(3n+2) {
            background-color: var(--card-2);
        }

        .card:nth-child(3n+3) {
            background-color: var(--card-3);
        }
    </style>
</head>
<body>
<input type="search" id="search" placeholder="What are you looking for?">
<div id="results"></div>
<script src="/lib/navplace.js"></script>
<script>
    const input = document.getElementById('search');
    const container = document.getElementById('results');

    main();

    function main()
    {
        navplace({input, update: refresh_results});
    }

    function refresh_results(items)
    {
        container.innerHTML = '';
        for (const item of items) {
            const card = document.createElement('a');
            card.href = item.href;
            card.className = 'card';
            const img = document.createElement('img');
            img.src = item.image_url || item.icon_url;
            img.alt = item.label;
            card.appendChild(img);
            const label = document.createElement('span');
            label.textContent = item.label;
            card.appendChild(label);
            container.appendChild(card);
        }
    }
</script>
</body>
</html>
