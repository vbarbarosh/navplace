<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPlace Portfolio</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #2c3e50;
            --muted: #6c757d;
            --tag-fg: #495057;
            --border: #e9ecef;
            --border-strong: #ced4da;
            --soft: #f8f9fa;
            /* Behind icons and pictures: light in both themes, so dark logos stay readable */
            --plate: #f8f9fa;
            --shadow: rgba(108, 117, 125, 0.12);
            --np-scrollbar-thumb: #ced4da;
            --np-scrollbar-track: #f8f9fa;
            --np-switch-bg: var(--surface);
            --np-switch-fg: var(--text);
            --np-switch-border: var(--border);
        }

        /* The dark theme: /lib/theme_switch.js sets it and shows the switch */
        :root[data-theme="dark"] {
            --bg: #121519;
            --surface: #1b1f24;
            --text: #e6e9ec;
            --muted: #98a2ad;
            --tag-fg: #c3cad1;
            --border: #2a3038;
            --border-strong: #3d4550;
            --soft: #22272e;
            --plate: #d5dade;
            --shadow: rgba(0, 0, 0, 0.4);
            --np-scrollbar-thumb: #3d4550;
            --np-scrollbar-track: #121519;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .navplace-container {
            display: grid;
            gap: 2rem;
        }

        .search-section {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .search-section .np-theme-switch {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-width: 2px;
            border-radius: 12px;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.125rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--surface);
            color: var(--text);
            transition: all 0.2s ease;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--muted);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .item-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
            text-decoration: none;
            color: inherit;
            position: relative;
            overflow: hidden;
        }

        .item-card:hover {
            transform: translateY(-4px);
            border-color: var(--border-strong);
            box-shadow: 0 8px 24px var(--shadow);
        }

        /* The link ↑ and ↓ move to (lib/navplace.js): lifted like a card under the mouse, its border in the text colour */
        .item-card.np-current {
            outline: none;
            transform: translateY(-4px);
            border-color: var(--text);
            box-shadow: 0 8px 24px var(--shadow);
        }

        .item-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--plate);
            padding: 8px;
            border: 1px solid var(--border);
        }

        .item-content {
            flex: 1;
            min-width: 0;
        }

        .item-label {
            font-weight: 600;
            font-size: 1.125rem;
            margin-bottom: 0.25rem;
            color: var(--text);
            line-height: 1.4;
        }

        .item-href {
            font-size: 0.875rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
            word-break: break-all;
        }

        .item-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .meta-tag {
            background: var(--soft);
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.75rem;
            color: var(--tag-fg);
            border: 1px solid var(--border);
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--plate);
            border: 1px solid var(--border);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
            font-size: 1.125rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .items-grid {
                grid-template-columns: 1fr;
            }

            .item-card {
                padding: 1.25rem;
            }
        }
    </style>
</head>
<body>
<div class="navplace-container">
    <div class="search-section">
        <input type="search"
               class="search-input"
               placeholder="Search portfolio items..."
               aria-label="Search portfolio items">
        <span data-theme-switch></span>
    </div>

    <div class="items-grid" id="items-container">
        <!-- Items will be rendered here by NavPlace -->
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script>
    main();

    function main()
    {
        const container = document.getElementById('items-container');
        const search_input = document.querySelector('input[type="search"]');

        if (typeof navplace === 'function') {
            navplace({input: search_input, update: refresh_items});
        }

        // Initial empty state
        refresh_items([]);

        function refresh_items(items, {current} = {}) {
            if (!items || (items.length === 0)) {
                container.innerHTML = `
                        <div class="empty-state">
                            No items found. Try a different search.
                        </div>
                    `;
                return;
            }

            container.innerHTML = items.map((item, i) => render_item_html(item, i === current)).join('');

            function render_item_html(item, is_current) {
                const icon_html = item.icon_url ? `
                            <img src="${html_escape(item.icon_url)}"
                                 alt="${html_escape(item.label)} icon"
                                 class="item-icon"
                                 onerror="this.style.display='none'">
                        ` : '';
                const meta_html = (item.meta && (Object.keys(item.meta).length > 0)) ? `
                                <div class="item-meta">
                                    ${Object.entries(item.meta).map(render_meta_tag_html).join('')}
                                </div>
                            ` : '';
                const image_html = item.image_url ? `
                            <img src="${html_escape(item.image_url)}"
                                 alt="${html_escape(item.label)} preview"
                                 class="item-image"
                                 onerror="this.style.display='none'">
                        ` : '';
                return `
                    <a href="${html_escape(item.href)}" class="item-card ${is_current ? 'np-current' : ''}" target="_blank" rel="noopener">
                        ${icon_html}

                        <div class="item-content">
                            <div class="item-label">${html_escape(item.label)}</div>
                            <div class="item-href">${html_escape(item.href)}</div>

                            ${meta_html}
                        </div>

                        ${image_html}
                    </a>
                `;
            }
        }

        // [key, value] of item.meta
        function render_meta_tag_html(entry) {
            return `
                                        <span class="meta-tag">
                                            ${html_escape(entry[0])}: ${html_escape(String(entry[1]))}
                                        </span>
                                    `;
        }

        // The links file is not trusted: every value from it goes into the HTML through this,
        // an attribute's value too
        function html_escape(text) {
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    }
</script>
</body>
</html>
