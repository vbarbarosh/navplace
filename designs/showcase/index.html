<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Showcase Theme | NavPlace</title>
    <script src="/lib/theme_switch.js"></script>
    <link href="theme.css" rel="stylesheet" />
</head>
<body>
<div class="page">

    <div class="topbar">
        <div class="identity">
            <h1>John Doe</h1>
            <a href="mailto:hello@example.com">hello@example.com</a>
        </div>
        <span data-theme-switch></span>
    </div>

    <div class="search">
        <label class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search" />
        </label>
    </div>

    <h2 class="section-title">Showcase</h2>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden></p>
</div>

<script src="/lib/navplace.js"></script>
<script>
main();

function main()
{
    // The word the page itself writes over the links, for a file with no `% subtitle`
    const section_title = document.querySelector('.section-title');
    const section_title_own = section_title.textContent;
    // The links drawn now, in their order on the page, and the tile of each
    let drawn = [];
    let tiles = [];

    navplace({
        input: '#search',
        meta: {title: '.identity h1', email: '.identity a', subtitle: '.section-title'},
        update: (v, {item = null} = {}) => refresh_grid(v, item),
    });

    // `current_item`: the link ↑ and ↓ chose (lib/navplace.js), the one Enter opens
    function refresh_grid(items, current_item) {
        const grid = document.getElementById('grid');
        // The links of one heading stand together under it, the headings in the order their first
        // link came: a search puts its best matches first, which would cut a heading in two
        const items_by_heading = new Map();
        for (const item of items) {
            const heading = item.namespaces?.[0] ?? null;
            if (!items_by_heading.has(heading)) {
                items_by_heading.set(heading, []);
            }
            items_by_heading.get(heading).push(item);
        }
        const shown = [...items_by_heading.values()].flat();
        // The same links as are drawn, ↑ or ↓ moved the mark: the tiles stay as they are, pictures
        // and all, and only the mark moves
        if (shown.length && (shown.length === drawn.length) && shown.every((v, i) => v === drawn[i])) {
            for (const [i, tile] of tiles.entries()) {
                tile.classList.toggle('np-current', shown[i] === current_item);
            }
            return;
        }
        drawn = shown;
        tiles = shown.map(function (item) {
            const templ = document.createElement('template');
            templ.innerHTML = `
                <a class="tile">
                    <div class="icon">
                        <img>
                    </div>
                    <div>
                        <div class="label"></div>
                        <div class="sub"></div>
                    </div>
                </a>
            `;
            const out = templ.content.firstElementChild;
            // The links file is not trusted: its text enters as text or a set attribute, never as HTML
            out.href = item.href;
            out.querySelector('img').src = item.icon_url;
            // An icon that cannot be loaded: the link's first letter stands in its tile (.icon[data-letter] in theme.css)
            out.querySelector('img').addEventListener('error', function (event) {
                event.target.parentElement.dataset.letter = letter_from_label(item.label);
            });
            out.querySelector('.label').textContent = item.label;
            // A name too long for its tile is cut with an ellipsis: its full text is in the title
            out.querySelector('.label').title = item.label;
            out.querySelector('.sub').textContent = new URL(item.href).host.replace(/^www\./, '');
            out.classList.toggle('np-current', item === current_item);
            out.onclick = function (event) {
                navplace.navigate(item, event);
            };
            return out;
        });
        // A heading of the links file is drawn once, over its links, with how many of them are shown
        const parts = [];
        for (const [i, item] of shown.entries()) {
            const heading = item.namespaces?.[0] ?? null;
            if (heading && (heading !== (shown[i - 1]?.namespaces?.[0] ?? null))) {
                const title = document.createElement('h3');
                title.className = 'group-title';
                title.textContent = heading;
                const count = document.createElement('span');
                count.className = 'count';
                count.textContent = items_by_heading.get(heading).length;
                title.append(count);
                parts.push(title);
            }
            parts.push(tiles[i]);
        }
        grid.replaceChildren(...parts);
        // The page's own word is not shown over a heading of the file: the heading says what
        // follows. A subtitle the file wrote stays, and so does the word over links with no
        // heading; a search that finds nothing leaves it as it was
        if (shown.length) {
            section_title.hidden = (section_title.textContent === section_title_own) && !!shown[0].namespaces?.[0];
        }
        // ↑ ↓ and Enter walk the links in the order they stand on the page
        navplace.order_set?.(shown);
        // No link to show: a search that finds nothing is told apart from a file with no links by the search box
        const empty = document.getElementById('empty');
        empty.hidden = (items.length > 0);
        empty.textContent = document.getElementById('search').value.trim() ? 'Nothing found' : 'No links yet';
    }

    // The first letter or digit of a link's name, in capitals; ? for a name that has none
    function letter_from_label(label) {
        return (String(label).match(/[\p{L}\p{N}]/u)?.[0] ?? '?').toUpperCase();
    }
}
</script>
</body>
</html>
