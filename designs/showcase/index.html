<!doctype html>
<html lang="en" data-theme="system">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Showcase Theme | NavPlace</title>
    <link href="theme.css" rel="stylesheet" />
</head>
<body>
<div class="page">

    <div class="topbar">
        <div class="identity">
            <h1>John Doe</h1>
            <a href="mailto:hello@example.com">hello@example.com</a>
        </div>
        <div class="theme-switch" role="group" aria-label="Theme">
            <button data-theme="system">Auto</button>
            <button data-theme="light">Light</button>
            <button data-theme="dark">Dark</button>
        </div>
    </div>

    <div class="search">
        <input id="search" type="search" placeholder="Search" autocomplete="off" />
    </div>

    <h2 class="section-title">Showcase</h2>
    <div id="grid" class="grid"></div>
</div>

<script src="/lib/navplace.js"></script>
<script>
main();

function main()
{
    navplace({
        input: '#search',
        meta: {title: '.identity h1', email: '.identity a', subtitle: '.section-title'},
        update: v => refresh_grid(v),
    });

    const root = document.documentElement;
    const buttons = document.querySelectorAll('.theme-switch button');

    const saved = theme_read();
    theme_apply(saved);

    for (const button of buttons) {
        button.addEventListener('click', () => theme_apply(button.dataset.theme));
    }

    function refresh_grid(items) {
        const grid = document.getElementById('grid');
        grid.replaceChildren(...items.map(function (item) {
            const templ = document.createElement('template');
            templ.innerHTML = `
                <a href="${item.href}" class="tile">
                    <div class="icon">
                        <img src="${item.icon_url}">
                    </div>
                    <div>
                        <div class="label">${item.label}</div>
                        <div class="sub">${new URL(item.href).host}</div>
                    </div>
                </a>
            `;
            const out = templ.content.firstElementChild;
            out.onclick = function (event) {
                navplace.navigate(item, event);
            };
            return out;
        }));
    }

    // 'system' when nothing is saved or the storage is closed
    function theme_read() {
        try {
            return localStorage.getItem('theme') || 'system';
        }
        catch {
            return 'system';
        }
    }

    function theme_apply(theme) {
        if (theme !== 'system') {
            root.dataset.theme = theme;
        }
        else if (matchMedia('(prefers-color-scheme: dark)').matches) {
            root.dataset.theme = 'dark';
        }
        else {
            root.dataset.theme = 'light';
        }
        for (const button of buttons) {
            button.classList.toggle('active', button.dataset.theme === theme);
        }
        try {
            localStorage.setItem('theme', theme);
        }
        catch {
            // Not kept: the page still switches
        }
    }
}
</script>
</body>
</html>
