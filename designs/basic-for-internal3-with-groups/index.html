<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>NavPlace Theme — Ops Links</title>
    <style>
        :root {
            --bg: #0b0c0f;
            --panel: #101218;
            --panel-2: #0e1015;
            --border: rgba(255,255,255,.10);
            --border-2: rgba(255,255,255,.14);
            --text: rgba(255,255,255,.92);
            --muted: rgba(255,255,255,.66);
            --muted-2: rgba(255,255,255,.52);
            --dim: rgba(255,255,255,.12);
            --hover: rgba(255,255,255,.06);
            --focus: rgba(180, 205, 255, .45);
            --accent: #7fb3ff;

            --radius: 10px;
            --radius-2: 12px;
            --shadow: 0 12px 30px rgba(0,0,0,.40);
            --shadow-2: 0 6px 16px rgba(0,0,0,.30);

            --gap: 10px;
            --gap-2: 12px;

            --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

            --row-h: 38px;
            --icon: 16px;
            --thumb: 26px;

            --sticky-top: 0px;
        }

        [data-theme="light"] {
            --bg: #f6f7fa;
            --panel: #ffffff;
            --panel-2: #fbfbfd;
            --border: rgba(0,0,0,.10);
            --border-2: rgba(0,0,0,.14);
            --text: rgba(0,0,0,.88);
            --muted: rgba(0,0,0,.62);
            --muted-2: rgba(0,0,0,.50);
            --dim: rgba(0,0,0,.10);
            --hover: rgba(0,0,0,.04);
            --focus: rgba(40, 90, 200, .35);
            --accent: #1b66ff;

            --shadow: 0 12px 30px rgba(0,0,0,.12);
            --shadow-2: 0 6px 16px rgba(0,0,0,.10);
        }

        * { box-sizing: border-box; }

        html,
        body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            min-height: 100%;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,.25), rgba(0,0,0,0));
            padding: 12px 12px 8px 12px;
        }

        [data-theme="light"] .topbar {
            background: linear-gradient(to bottom, rgba(255,255,255,.85), rgba(255,255,255,0));
        }

        .shell {
            margin: 0 auto;
            width: min(1100px, calc(100% - 24px));
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .brand__title {
            font-weight: 650;
            font-size: 14px;
            letter-spacing: .02em;
            text-transform: uppercase;
            color: var(--muted);
            user-select: none;
            white-space: nowrap;
        }

        .brand__meta {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 52ch;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .select {
            appearance: none;
            background: var(--panel);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 32px 8px 10px;
            font-size: 12px;
            line-height: 1;
            outline: none;
            box-shadow: var(--shadow-2);
            cursor: pointer;
            position: relative;
        }

        .select:focus { box-shadow: 0 0 0 3px var(--focus), var(--shadow-2); }

        .select-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .select-wrap::after {
            content: "";
            position: absolute;
            right: 10px;
            width: 10px;
            height: 10px;
            pointer-events: none;
            border-right: 2px solid var(--muted);
            border-bottom: 2px solid var(--muted);
            transform: rotate(45deg);
            opacity: .85;
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .search {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 10px 10px;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            border: 1px solid var(--border);
            border-radius: var(--radius-2);
            box-shadow: var(--shadow);
        }

        .search__icon {
            width: 14px;
            height: 14px;
            border: 2px solid var(--muted);
            border-radius: 50%;
            position: relative;
            opacity: .9;
        }

        .search__icon::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 2px;
            background: var(--muted);
            right: -6px;
            bottom: -2px;
            transform: rotate(45deg);
            border-radius: 2px;
            opacity: .9;
        }

        .search input[type="search"]{
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            line-height: 1.2;
            padding: 4px 0;
            min-width: 0;
        }

        .search input[type="search"]::placeholder { color: var(--muted-2); }

        .hint {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            user-select: none;
            white-space: nowrap;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .kbd {
            border: 1px solid var(--border);
            border-bottom-color: var(--border-2);
            background: var(--panel-2);
            border-radius: 7px;
            padding: 3px 6px;
            line-height: 1;
            color: var(--muted);
        }

        .main {
            padding: 0 12px 14px 12px;
        }

        .panel {
            background: color-mix(in srgb, var(--panel) 88%, transparent);
            border: 1px solid var(--border);
            border-radius: var(--radius-2);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(to bottom, rgba(255,255,255,.04), rgba(255,255,255,0));
        }

        [data-theme="light"] .summary {
            background: linear-gradient(to bottom, rgba(0,0,0,.03), rgba(0,0,0,0));
        }

        .summary__left {
            display: flex;
            gap: 10px;
            align-items: baseline;
            min-width: 0;
        }

        .summary__title {
            font-weight: 650;
            font-size: 12px;
            letter-spacing: .03em;
            text-transform: uppercase;
            color: var(--muted);
            user-select: none;
        }

        .summary__count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            user-select: none;
            white-space: nowrap;
        }

        .summary__right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--border);
            background: var(--panel-2);
            border-radius: 999px;
            padding: 4px 8px;
            user-select: none;
            white-space: nowrap;
        }

        .list {
            height: calc(100vh - 170px);
            min-height: 320px;
            overflow: auto;
            scroll-behavior: auto;
        }

        .group {
            border-top: 1px solid var(--border);
        }

        .group:first-child { border-top: none; }

        .group__hdr {
            position: sticky;
            top: var(--sticky-top);
            z-index: 5;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            border-bottom: 1px solid var(--border);
            padding: 7px 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            backdrop-filter: blur(6px);
        }

        .group__name {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .group__host {
            font-weight: 650;
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .group__sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 56ch;
        }

        .group__count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
        }

        .rows {
            display: grid;
        }

        .row {
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 6px 10px;
            min-height: var(--row-h);
            border-bottom: 1px solid var(--border);
            cursor: default;
        }

        .row:last-child { border-bottom: none; }

        .row:hover { background: var(--hover); }

        .row:focus-within { background: color-mix(in srgb, var(--hover) 65%, transparent); }

        .row[aria-selected="true"] { background: color-mix(in srgb, var(--hover) 65%, transparent); }

        .favicon {
            width: var(--icon);
            height: var(--icon);
            border-radius: 4px;
            background: var(--dim);
            border: 1px solid var(--border);
            overflow: hidden;
            flex: none;
        }

        .favicon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb {
            width: var(--thumb);
            height: var(--thumb);
            border-radius: 7px;
            background: var(--dim);
            border: 1px solid var(--border);
            overflow: hidden;
            flex: none;
            display: none;
        }

        .thumb.is-on { display: block; }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .text {
            min-width: 0;
            display: grid;
            gap: 2px;
        }

        .label {
            font-size: 13px;
            line-height: 1.2;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .href {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .actions {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: flex-end;
        }

        .btn {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--muted);
            border-radius: 9px;
            padding: 6px 8px;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            user-select: none;
            min-width: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover { border-color: var(--border-2); }

        .btn:focus { outline: none; box-shadow: 0 0 0 3px var(--focus); }

        .btn[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: color-mix(in srgb, var(--accent) 75%, var(--text)); }

        .btn--go {
            border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
            color: color-mix(in srgb, var(--accent) 65%, var(--text));
        }

        .sr {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0,0,0,0);
            border: 0;
        }

        .empty {
            padding: 26px 12px;
            color: var(--muted-2);
            font-family: var(--mono);
            font-size: 12px;
            text-align: center;
            user-select: none;
        }

        @media (max-width: 720px) {
            .brand__meta { display: none; }

            .hint { display: none; }

            .list { height: calc(100vh - 160px); }

            .row { grid-template-columns: auto 1fr auto; }

            .thumb { display: none !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
<div class="app" id="app" data-theme="system">
    <div class="topbar">
        <div class="shell">
            <div class="header">
                <div class="brand">
                    <div class="brand__title">NavPlace · Ops Theme</div>
                    <div class="brand__meta" id="meta">renderer-only · grouped by host</div>
                </div>
                <div class="controls">
                    <div class="select-wrap">
                        <label class="sr" for="theme-select">Theme</label>
                        <select id="theme-select" class="select">
                            <option value="system">System</option>
                            <option value="dark">Dark</option>
                            <option value="light">Light</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="search-row">
                <div class="search" id="search-wrap">
                    <div class="search__icon" aria-hidden="true"></div>
                    <input type="search" id="navplace-search" placeholder="Search…" autocomplete="off" spellcheck="false" />
                    <div class="hint" aria-hidden="true">
                        <span class="kbd">↑</span><span class="kbd">↓</span>
                        <span class="kbd">Enter</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="shell">
            <div class="panel">
                <div class="summary">
                    <div class="summary__left">
                        <div class="summary__title">Links</div>
                        <div class="summary__count" id="counts">0 items · 0 groups</div>
                    </div>
                    <div class="summary__right">
                        <div class="pill" id="status">idle</div>
                    </div>
                </div>

                <div class="list" id="list" role="listbox" aria-label="Operational links"></div>
            </div>
        </div>
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script src="/lib/plural.js"></script>
<script>
    main();

    function main()
    {
        let active_row = null;

        const app = document.getElementById('app');
        const theme_select = document.getElementById('theme-select');
        const list = document.getElementById('list');
        const counts = document.getElementById('counts');
        const status = document.getElementById('status');
        const meta = document.getElementById('meta');

        theme_load();

        if (window.matchMedia) {
            const media = window.matchMedia('(prefers-color-scheme: light)');
            if (media && media.addEventListener) {
                media.addEventListener('change', function () {
                    if (theme_mode_read() === 'system') {
                        theme_apply('system');
                    }
                });
            }
        }

        theme_select.addEventListener('change', function () {
            theme_save(theme_select.value);
        });

        list.addEventListener('keydown', function (event) {
            if (event.key === 'ArrowDown') {
                event.preventDefault();
                active_row_move(1);
                return;
            }
            if (event.key === 'ArrowUp') {
                event.preventDefault();
                active_row_move(-1);
                return;
            }
            if (event.key === 'Home') {
                event.preventDefault();
                active_row_move(-999999);
                return;
            }
            if (event.key === 'End') {
                event.preventDefault();
                active_row_move(999999);
                return;
            }
            if (event.key === 'Enter') {
                event.preventDefault();
                if (active_row) {
                    href_open(active_row.getAttribute('data-href'));
                }
            }
        });

        list.addEventListener('mousemove', function (event) {
            const row = (event.target && event.target.closest) ? event.target.closest('.row') : null;
            if (row && (row !== active_row)) {
                active_row_set(row);
            }
        });

        navplace_bind();
        status.textContent = (status.textContent === 'idle') ? 'ready' : status.textContent;

        function system_theme_detect() {
            return (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }

        function theme_apply(mode) {
            app.setAttribute('data-theme', mode);
            if (mode === 'system') {
                const system_theme = system_theme_detect();
                app.setAttribute('data-theme', system_theme);
                app.setAttribute('data-theme-mode', 'system');
            }
            else {
                app.setAttribute('data-theme-mode', mode);
            }
        }

        function theme_load() {
            const mode = theme_mode_read();
            theme_select.value = mode;
            theme_apply(mode);
        }

        function theme_save(mode) {
            try {
                localStorage.setItem('navplace_theme_mode', mode);
            }
            catch {
                // Not kept: the page still switches
            }
            theme_apply(mode);
        }

        // 'system' when nothing is saved or the storage is closed
        function theme_mode_read() {
            try {
                return localStorage.getItem('navplace_theme_mode') || 'system';
            }
            catch {
                return 'system';
            }
        }

        function text_from_value(value) {
            try {
                return String(value || '');
            }
            catch {
                return '';
            }
        }

        function text_truncate_middle(value, max) {
            const text = text_from_value(value);
            if (text.length <= max) {
                return text;
            }
            const head = Math.floor((max - 1)*0.62);
            const tail = (max - 1) - head;
            return `${text.slice(0, head)}…${text.slice(text.length - tail)}`;
        }

        function text_copy(value) {
            const text = text_from_value(value);
            if (!text) {
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {});
                return;
            }
            const textarea = make_elem('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
            }
            catch {
                // The copy is lost; the page goes on
            }
            document.body.removeChild(textarea);
        }

        function url_parts_from_href(href) {
            const text = text_from_value(href);
            if (!text) {
                return {host: 'unknown', proto: '', pathname: ''};
            }
            try {
                const url = new URL(text, window.location.href);
                return {host: url.host || ((url.protocol === 'file:') ? 'local' : 'unknown'), proto: url.protocol || '', pathname: url.pathname || ''};
            }
            catch {
                return {host: 'unknown', proto: '', pathname: ''};
            }
        }

        function group_key_from_item(item) {
            const url_parts = url_parts_from_href(text_from_value(item && item.href));
            if (url_parts.proto === 'file:') {
                return 'local';
            }
            if (url_parts.host && (url_parts.host !== 'unknown')) {
                return url_parts.host;
            }
            return 'other';
        }

        // Local links first, the others last, the hosts between them
        function group_rank(key) {
            if (key === 'local') {
                return 0;
            }
            if (key === 'other') {
                return 9;
            }
            return 1;
        }

        function format_group_subtitle(key, sample_href) {
            if (key === 'local') {
                return 'file://…';
            }
            if (key === 'other') {
                return 'misc';
            }
            return sample_href ? text_from_value(sample_href).replace(/^https?:\/\//, '').split('/')[0] : key;
        }

        function make_elem(tag, attrs) {
            const node = document.createElement(tag);
            if (attrs) {
                for (const key of Object.keys(attrs)) {
                    if (key === 'text') {
                        node.textContent = attrs[key];
                    }
                    else if (key === 'html') {
                        node.innerHTML = attrs[key];
                    }
                    else if (key === 'class') {
                        node.className = attrs[key];
                    }
                    else {
                        node.setAttribute(key, attrs[key]);
                    }
                }
            }
            return node;
        }

        function make_icon(url, alt) {
            const wrap = make_elem('div', {class: 'favicon', 'aria-hidden': 'true'});
            const img = make_elem('img', {src: text_from_value(url), alt: alt || ''});
            img.loading = 'lazy';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', function () {
                wrap.innerHTML = '';
                wrap.style.background = 'var(--dim)';
            });
            wrap.appendChild(img);
            return wrap;
        }

        function make_thumb(url) {
            const wrap = make_elem('div', {class: 'thumb is-on', 'aria-hidden': 'true'});
            const img = make_elem('img', {src: text_from_value(url), alt: ''});
            img.loading = 'lazy';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', function () {
                wrap.classList.remove('is-on');
                wrap.innerHTML = '';
            });
            wrap.appendChild(img);
            return wrap;
        }

        function make_row(item, index) {
            const href = text_from_value(item.href);
            const label = text_from_value(item.label) || text_truncate_middle(href, 64) || '(untitled)';
            const icon_url = text_from_value(item.icon_url);
            const image_url = text_from_value(item.image_url);

            const row = make_elem('div', {class: 'row', role: 'option', tabindex: '-1', 'data-index': String(index), 'data-href': href});
            row.appendChild(make_icon(icon_url, ''));
            if (image_url) {
                row.appendChild(make_thumb(image_url));
            }

            const text = make_elem('div', {class: 'text'});
            text.appendChild(make_elem('div', {class: 'label', text: label}));
            text.appendChild(make_elem('div', {class: 'href', text: text_truncate_middle(href, 110)}));
            row.appendChild(text);

            const actions = make_elem('div', {class: 'actions'});

            const button_open = make_elem('button', {class: 'btn btn--go', type: 'button', title: 'Open', 'aria-label': 'Open'});
            button_open.textContent = 'Open';
            button_open.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                href_open(href);
            });

            const button_copy = make_elem('button', {class: 'btn', type: 'button', title: 'Copy URL', 'aria-label': 'Copy URL'});
            button_copy.textContent = 'Copy';
            button_copy.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                text_copy(href);
                status_flash('copied');
            });

            actions.appendChild(button_open);
            actions.appendChild(button_copy);
            row.appendChild(actions);

            row.addEventListener('click', function () {
                active_row_set(row);
                href_open(href);
            });

            return row;
        }

        function href_open(href) {
            const url = text_from_value(href);
            if (!url) {
                return;
            }
            try {
                window.open(url, '_blank', 'noopener,noreferrer');
            }
            catch {
                try {
                    window.location.href = url;
                }
                catch {
                    // Nowhere left to open it
                }
            }
        }

        function active_row_set(row) {
            if (active_row && (active_row !== row)) {
                active_row.setAttribute('aria-selected', 'false');
            }
            active_row = row;
            if (active_row) {
                active_row.setAttribute('aria-selected', 'true');
                active_row.focus({preventScroll: true});
                node_scroll_into_view(active_row, list);
            }
        }

        function active_row_move(delta) {
            const rows = list.querySelectorAll('.row[role="option"]');
            if (!rows.length) {
                return;
            }

            let index = 0;
            if (active_row) {
                index = Math.max(0, Math.min(rows.length - 1, parseInt(active_row.getAttribute('data-index'), 10) || 0));
            }
            index = Math.max(0, Math.min(rows.length - 1, index + delta));

            let found = null;
            for (const row of rows) {
                if ((parseInt(row.getAttribute('data-index'), 10) || 0) === index) {
                    found = row;
                    break;
                }
            }
            if (!found) {
                found = rows[index];
            }
            if (found) {
                active_row_set(found);
            }
        }

        function node_scroll_into_view(node, container) {
            if (!node || !container) {
                return;
            }
            const node_rect = node.getBoundingClientRect();
            const container_rect = container.getBoundingClientRect();
            if (node_rect.top < container_rect.top + 4) {
                container.scrollTop -= (container_rect.top + 4 - node_rect.top);
            }
            else if (node_rect.bottom > container_rect.bottom - 4) {
                container.scrollTop += (node_rect.bottom - (container_rect.bottom - 4));
            }
        }

        function status_flash(text) {
            status.textContent = text;
            status.dataset.flash = String(Date.now());
            setTimeout(status_flash_clear, 520);

            function status_flash_clear() {
                if (status.dataset.flash && ((Date.now() - parseInt(status.dataset.flash, 10)) > 420)) {
                    status.textContent = 'ready';
                }
            }
        }

        function refresh_list(items) {
            let total = 0;

            const list_items = Array.isArray(items) ? items : [];
            const group_by_key = {};
            const group_keys = [];

            status.textContent = 'rendering';
            for (const list_item of list_items) {
                const item = list_item || {};
                const key = group_key_from_item(item);
                if (!group_by_key[key]) {
                    group_by_key[key] = {key, items: [], sample_href: text_from_value(item.href)};
                    group_keys.push(key);
                }
                group_by_key[key].items.push(item);
                total++;
            }

            group_keys.sort(function (a, b) {
                const rank_a = group_rank(a);
                const rank_b = group_rank(b);
                if (rank_a !== rank_b) {
                    return rank_a - rank_b;
                }
                return a.localeCompare(b);
            });

            list.innerHTML = '';
            active_row = null;

            const items_text = plural(total, '# item', '# items');
            const groups_text = plural(group_keys.length, '# group', '# groups');
            counts.textContent = `${items_text} · ${groups_text}`;
            meta.textContent = `renderer-only · grouped by host · ${app.getAttribute('data-theme-mode') || 'system'}`;

            if (!total) {
                list.appendChild(make_elem('div', {class: 'empty', text: 'No items.'}));
                status.textContent = 'ready';
                return;
            }

            let index = 0;
            for (const key of group_keys) {
                const group = group_by_key[key];
                const section = make_elem('section', {class: 'group'});
                const header = make_elem('div', {class: 'group__hdr'});
                const left = make_elem('div', {class: 'group__name'});

                let host;
                if (key === 'other') {
                    host = 'Other';
                }
                else if (key === 'local') {
                    host = 'Local';
                }
                else {
                    host = key;
                }
                left.appendChild(make_elem('div', {class: 'group__host', text: host}));

                const sub = format_group_subtitle(key, group.sample_href);
                left.appendChild(make_elem('div', {class: 'group__sub', text: sub}));

                header.appendChild(left);
                header.appendChild(make_elem('div', {class: 'group__count', text: String(group.items.length)}));

                const rows = make_elem('div', {class: 'rows'});
                for (const item of group.items) {
                    rows.appendChild(make_row(item, index));
                    index++;
                }

                section.appendChild(header);
                section.appendChild(rows);
                list.appendChild(section);
            }

            // The first row is marked, not focused: typing stays in the search
            const first = list.querySelector('.row[role="option"]');
            if (first) {
                active_row = first;
                active_row.setAttribute('aria-selected', 'true');
            }

            status.textContent = 'ready';
        }

        function navplace_bind() {
            const input = document.getElementById('navplace-search') || document.querySelector('input[type="search"]');
            if (!input) {
                return;
            }

            input.addEventListener('keydown', function (event) {
                if (event.key === 'ArrowDown') {
                    event.preventDefault();
                    list.focus();
                    active_row_move(1);
                    return;
                }
                if (event.key === 'ArrowUp') {
                    event.preventDefault();
                    list.focus();
                    active_row_move(-1);
                    return;
                }
                if ((event.key === 'Enter') && active_row) {
                    event.preventDefault();
                    href_open(active_row.getAttribute('data-href'));
                }
            });

            try {
                if (typeof window.navplace === 'function') {
                    window.navplace({
                        input,
                        update: refresh_list,
                        // Enter is handled above: it opens the active row
                        navigate: function () {},
                    });
                    status_flash('bound');
                }
                else {
                    status.textContent = 'navplace missing';
                }
            }
            catch {
                status.textContent = 'bind error';
            }
        }
    }
</script>
</body>
</html>
