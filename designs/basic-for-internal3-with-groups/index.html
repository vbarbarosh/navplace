<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>NavPlace Theme — Ops Links</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        /* Light on :root, dark on :root[data-theme="dark"]: /lib/theme_switch.js sets it and shows the switch */
        :root {
            --bg: #f6f7fa;
            --panel: #ffffff;
            --panel-2: #fbfbfd;
            --border: rgba(0,0,0,.10);
            --border-2: rgba(0,0,0,.14);
            --text: rgba(0,0,0,.88);
            --muted: rgba(0,0,0,.62);
            --muted-2: rgba(0,0,0,.56);
            --dim: rgba(0,0,0,.10);
            --hover: rgba(0,0,0,.04);
            --focus: rgba(40, 90, 200, .35);
            --accent: #1b66ff;
            --topbar-fade: rgba(255,255,255,.85);
            --topbar-fade-0: rgba(255,255,255,0);
            --summary-tint: rgba(0,0,0,.03);
            --summary-tint-0: rgba(0,0,0,0);
            --np-scrollbar-thumb: rgba(0,0,0,.28);
            --np-switch-bg: var(--panel);
            --np-switch-fg: var(--muted);
            --np-switch-border: var(--border);

            --radius: 10px;
            --radius-2: 12px;
            --shadow: 0 12px 30px rgba(0,0,0,.12);
            --shadow-2: 0 6px 16px rgba(0,0,0,.10);

            --gap: 10px;
            --gap-2: 12px;

            --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

            --row-h: 38px;
            --icon: 16px;
            --thumb: 26px;

            --sticky-top: 0px;
        }

        :root[data-theme="dark"] {
            --bg: #0b0c0f;
            --panel: #101218;
            --panel-2: #0e1015;
            --border: rgba(255,255,255,.10);
            --border-2: rgba(255,255,255,.14);
            --text: rgba(255,255,255,.92);
            --muted: rgba(255,255,255,.66);
            --muted-2: rgba(255,255,255,.52);
            --dim: rgba(255,255,255,.12);
            --hover: rgba(255,255,255,.06);
            --focus: rgba(180, 205, 255, .45);
            --accent: #7fb3ff;

            --shadow: 0 12px 30px rgba(0,0,0,.40);
            --shadow-2: 0 6px 16px rgba(0,0,0,.30);
            --topbar-fade: rgba(0,0,0,.25);
            --topbar-fade-0: rgba(0,0,0,0);
            --summary-tint: rgba(255,255,255,.04);
            --summary-tint-0: rgba(255,255,255,0);
            --np-scrollbar-thumb: rgba(255,255,255,.22);
        }

        * { box-sizing: border-box; }

        html,
        body { height: 100%; }

        /* On a view too short for the whole page, ↑ stops a row below the stuck .topbar, not under
           it: the bar's padding (12px and 8px), its header (as tall as the theme switch, 32px, with
           10px under it) and its search box (10px of padding and a 1px border around an input of
           14px × 1.2 with 4px above and below) */
        html { scroll-padding-top: calc(12px + 32px + 10px + 2*11px + 1.2*14px + 2*4px + 8px); }

        body {
            margin: 0;
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            min-height: 100%;
            display: grid;
            grid-template-rows: auto 1fr;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: linear-gradient(to bottom, var(--topbar-fade), var(--topbar-fade-0));
            padding: 12px 12px 8px 12px;
        }

        .shell {
            margin: 0 auto;
            width: min(1100px, calc(100% - 24px));
        }

        .header {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .brand__title {
            font-weight: 650;
            font-size: 14px;
            letter-spacing: .02em;
            text-transform: uppercase;
            color: var(--muted);
            user-select: none;
            white-space: nowrap;
        }

        .brand__meta {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 52ch;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
        }

        .search {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 10px 10px;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            border: 1px solid var(--border);
            border-radius: var(--radius-2);
            box-shadow: var(--shadow);
        }

        /* The keyboard is in the search box: it wears the ring of a focused button */
        .search:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--focus), var(--shadow);
        }

        .search__icon {
            width: 14px;
            height: 14px;
            border: 2px solid var(--muted);
            border-radius: 50%;
            position: relative;
            opacity: .9;
        }

        .search__icon::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 2px;
            background: var(--muted);
            right: -6px;
            bottom: -2px;
            transform: rotate(45deg);
            border-radius: 2px;
            opacity: .9;
        }

        .search input[type="search"]{
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: var(--text);
            font-size: 14px;
            line-height: 1.2;
            padding: 4px 0;
            min-width: 0;
        }

        .search input[type="search"]::placeholder { color: var(--muted-2); }

        .hint {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            user-select: none;
            white-space: nowrap;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .kbd {
            border: 1px solid var(--border);
            border-bottom-color: var(--border-2);
            background: var(--panel-2);
            border-radius: 7px;
            padding: 3px 6px;
            line-height: 1;
            color: var(--muted);
        }

        .main {
            padding: 0 12px 14px 12px;
        }

        .panel {
            background: color-mix(in srgb, var(--panel) 88%, transparent);
            border: 1px solid var(--border);
            border-radius: var(--radius-2);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(to bottom, var(--summary-tint), var(--summary-tint-0));
        }

        .summary__left {
            display: flex;
            gap: 10px;
            align-items: baseline;
            min-width: 0;
        }

        .summary__title {
            font-weight: 650;
            font-size: 12px;
            letter-spacing: .03em;
            text-transform: uppercase;
            color: var(--muted);
            user-select: none;
        }

        .summary__count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            user-select: none;
            white-space: nowrap;
        }

        .summary__right {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .pill {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            border: 1px solid var(--border);
            background: var(--panel-2);
            border-radius: 999px;
            padding: 4px 8px;
            user-select: none;
            white-space: nowrap;
        }

        /* ↑ stops a row below the stuck .group__hdr, not under it: where the header sticks, its
           padding (7px above and below), its line of 12px text (as tall as the font makes it: taken
           as 18px) and its border */
        .list {
            height: calc(100vh - 170px);
            min-height: 320px;
            overflow: auto;
            scroll-behavior: auto;
            scroll-padding-top: calc(var(--sticky-top) + 7px + 18px + 7px + 1px);
        }

        .group {
            border-top: 1px solid var(--border);
        }

        .group:first-child { border-top: none; }

        .group__hdr {
            position: sticky;
            top: var(--sticky-top);
            z-index: 5;
            background: color-mix(in srgb, var(--panel) 92%, transparent);
            border-bottom: 1px solid var(--border);
            padding: 7px 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
            backdrop-filter: blur(6px);
        }

        .group__name {
            display: flex;
            align-items: baseline;
            gap: 10px;
            min-width: 0;
        }

        .group__host {
            font-weight: 650;
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .group__sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 56ch;
        }

        .group__count {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
        }

        .rows {
            display: grid;
        }

        .row {
            position: relative;
            display: grid;
            grid-template-columns: auto auto 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 6px 10px;
            min-height: var(--row-h);
            border-bottom: 1px solid var(--border);
            cursor: default;
        }

        .row:last-child { border-bottom: none; }

        .row:hover { background: var(--hover); }

        .row:focus-within { background: color-mix(in srgb, var(--hover) 65%, transparent); }

        /* The link ↑ ↓ moved to (the runtime keeps it): Enter opens it */
        .row.np-current {
            outline: none;
            background: color-mix(in srgb, var(--accent) 12%, transparent);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .favicon {
            width: var(--icon);
            height: var(--icon);
            border-radius: 4px;
            background: var(--dim);
            border: 1px solid var(--border);
            overflow: hidden;
            flex: none;
        }

        .favicon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .thumb {
            width: var(--thumb);
            height: var(--thumb);
            border-radius: 7px;
            background: var(--dim);
            border: 1px solid var(--border);
            overflow: hidden;
            flex: none;
            display: none;
        }

        .thumb.is-on { display: block; }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .text {
            min-width: 0;
            display: grid;
            gap: 2px;
        }

        /* The row's link: the label is its text, and its ::after lies over the whole row, under the
           buttons, so the row is one link to the mouse */
        .label {
            font-size: 13px;
            line-height: 1.2;
            color: var(--text);
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .label::after {
            content: "";
            position: absolute;
            inset: 0;
        }

        /* Tab on a link rings its row */
        .label:focus-visible { outline: none; }

        .label:focus-visible::after {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }

        .href {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* The buttons stand above the row's link; the room around them stays the link's */
        .actions {
            position: relative;
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: flex-end;
            pointer-events: none;
        }

        .btn {
            appearance: none;
            border: 1px solid var(--border);
            background: var(--panel-2);
            color: var(--muted);
            border-radius: 9px;
            padding: 6px 8px;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            min-width: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover { border-color: var(--border-2); }

        .btn:focus { outline: none; box-shadow: 0 0 0 3px var(--focus); }

        .btn[aria-pressed="true"] { border-color: color-mix(in srgb, var(--accent) 55%, var(--border)); color: color-mix(in srgb, var(--accent) 75%, var(--text)); }

        .btn--go {
            border-color: color-mix(in srgb, var(--accent) 30%, var(--border));
            color: color-mix(in srgb, var(--accent) 65%, var(--text));
        }

        .empty {
            padding: 26px 12px;
            color: var(--muted-2);
            font-family: var(--mono);
            font-size: 12px;
            text-align: center;
            user-select: none;
        }

        @media (max-width: 720px) {
            .brand__meta { display: none; }

            .hint { display: none; }

            .list { height: calc(100vh - 160px); }

            .row { grid-template-columns: auto 1fr auto; }

            .thumb { display: none !important; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="topbar">
        <div class="shell">
            <div class="header">
                <div class="brand">
                    <div class="brand__title">NavPlace · Ops Theme</div>
                    <div class="brand__meta" id="meta">renderer-only · grouped by host</div>
                </div>
                <div class="controls">
                    <span data-theme-switch></span>
                </div>
            </div>

            <div class="search-row">
                <div class="search" id="search-wrap">
                    <div class="search__icon" aria-hidden="true"></div>
                    <input type="search" id="navplace-search" placeholder="Search…" autocomplete="off" spellcheck="false" />
                    <div class="hint" aria-hidden="true">
                        <span class="kbd">↑</span><span class="kbd">↓</span>
                        <span class="kbd">Enter</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="main">
        <div class="shell">
            <div class="panel">
                <div class="summary">
                    <div class="summary__left">
                        <div class="summary__title">Links</div>
                        <div class="summary__count" id="counts">0 items · 0 groups</div>
                    </div>
                    <div class="summary__right">
                        <div class="pill" id="status">idle</div>
                    </div>
                </div>

                <div class="list" id="list" role="region" aria-label="Operational links"></div>
            </div>
        </div>
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script src="/lib/plural.js"></script>
<script>
    main();

    function main()
    {
        const list = document.getElementById('list');
        const counts = document.getElementById('counts');
        const status = document.getElementById('status');
        const meta = document.getElementById('meta');

        navplace_bind();
        status.textContent = (status.textContent === 'idle') ? 'ready' : status.textContent;

        function text_from_value(value) {
            try {
                return String(value || '');
            }
            catch {
                return '';
            }
        }

        function text_truncate_middle(value, max) {
            const text = text_from_value(value);
            if (text.length <= max) {
                return text;
            }
            const head = Math.floor((max - 1)*0.62);
            const tail = (max - 1) - head;
            return `${text.slice(0, head)}…${text.slice(text.length - tail)}`;
        }

        function text_copy(value) {
            const text = text_from_value(value);
            if (!text) {
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).catch(function () {});
                return;
            }
            const textarea = make_elem('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
            }
            catch {
                // The copy is lost; the page goes on
            }
            document.body.removeChild(textarea);
        }

        function url_parts_from_href(href) {
            const text = text_from_value(href);
            if (!text) {
                return {host: 'unknown', proto: '', pathname: ''};
            }
            try {
                const url = new URL(text, window.location.href);
                return {host: url.host || ((url.protocol === 'file:') ? 'local' : 'unknown'), proto: url.protocol || '', pathname: url.pathname || ''};
            }
            catch {
                return {host: 'unknown', proto: '', pathname: ''};
            }
        }

        function group_key_from_item(item) {
            const url_parts = url_parts_from_href(text_from_value(item && item.href));
            if (url_parts.proto === 'file:') {
                return 'local';
            }
            if (url_parts.host && (url_parts.host !== 'unknown')) {
                return url_parts.host;
            }
            return 'other';
        }

        // Local links first, the others last, the hosts between them
        function group_rank(key) {
            if (key === 'local') {
                return 0;
            }
            if (key === 'other') {
                return 9;
            }
            return 1;
        }

        function format_group_subtitle(key, sample_href) {
            if (key === 'local') {
                return 'file://…';
            }
            if (key === 'other') {
                return 'misc';
            }
            return sample_href ? text_from_value(sample_href).replace(/^https?:\/\//, '').split('/')[0] : key;
        }

        function make_elem(tag, attrs) {
            const node = document.createElement(tag);
            if (attrs) {
                for (const key of Object.keys(attrs)) {
                    if (key === 'text') {
                        node.textContent = attrs[key];
                    }
                    else if (key === 'html') {
                        node.innerHTML = attrs[key];
                    }
                    else if (key === 'class') {
                        node.className = attrs[key];
                    }
                    else {
                        node.setAttribute(key, attrs[key]);
                    }
                }
            }
            return node;
        }

        function make_icon(url, alt) {
            const wrap = make_elem('div', {class: 'favicon', 'aria-hidden': 'true'});
            const img = make_elem('img', {src: text_from_value(url), alt: alt || ''});
            img.loading = 'lazy';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', function () {
                wrap.innerHTML = '';
                wrap.style.background = 'var(--dim)';
            });
            wrap.appendChild(img);
            return wrap;
        }

        function make_thumb(url) {
            const wrap = make_elem('div', {class: 'thumb is-on', 'aria-hidden': 'true'});
            const img = make_elem('img', {src: text_from_value(url), alt: ''});
            img.loading = 'lazy';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.addEventListener('error', function () {
                wrap.classList.remove('is-on');
                wrap.innerHTML = '';
            });
            wrap.appendChild(img);
            return wrap;
        }

        function make_row(item, index) {
            const href = text_from_value(item.href);
            const label = text_from_value(item.label) || text_truncate_middle(href, 64) || '(untitled)';
            const icon_url = text_from_value(item.icon_url);
            const image_url = text_from_value(item.image_url);

            const row = make_elem('div', {class: 'row', 'data-index': String(index), 'data-href': href});
            row.appendChild(make_icon(icon_url, ''));
            if (image_url) {
                row.appendChild(make_thumb(image_url));
            }

            const text = make_elem('div', {class: 'text'});
            // A name too long for its row is cut with an ellipsis: its full text is in the title
            text.appendChild(make_elem('a', {class: 'label', href, title: label, text: label}));
            text.appendChild(make_elem('div', {class: 'href', text: text_truncate_middle(href, 110)}));
            row.appendChild(text);

            const actions = make_elem('div', {class: 'actions'});

            const button_open = make_elem('button', {class: 'btn btn--go', type: 'button', title: 'Open', 'aria-label': 'Open'});
            button_open.textContent = 'Open';
            button_open.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                navplace.navigate(item);
            });

            const button_copy = make_elem('button', {class: 'btn', type: 'button', title: 'Copy URL', 'aria-label': 'Copy URL'});
            button_copy.textContent = 'Copy';
            button_copy.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();
                text_copy(href);
                status_flash('copied');
            });

            actions.appendChild(button_open);
            actions.appendChild(button_copy);
            row.appendChild(actions);

            // A click on the row, or on its Open, opens the link through the runtime: every
            // selected link, this one in place of the last. The row's link lies over all of it but
            // the buttons, so Ctrl, Shift and the middle button there are left to the browser
            row.addEventListener('click', function (event) {
                navplace.navigate(item, event);
            });

            return row;
        }

        function status_flash(text) {
            status.textContent = text;
            status.dataset.flash = String(Date.now());
            setTimeout(status_flash_clear, 520);

            function status_flash_clear() {
                if (status.dataset.flash && ((Date.now() - parseInt(status.dataset.flash, 10)) > 420)) {
                    status.textContent = 'ready';
                }
            }
        }

        // `item`: the link ↑ ↓ moved to. The links are drawn grouped by host, and the runtime is told that
        // order (navplace.order_set), so ↑ ↓ and Enter follow the rows as they stand on screen
        function refresh_list(items, {item: current_item = null} = {}) {
            let total = 0;

            const list_items = Array.isArray(items) ? items : [];
            const group_by_key = {};
            const group_keys = [];

            status.textContent = 'rendering';
            for (const list_item of list_items) {
                const item = list_item || {};
                const key = group_key_from_item(item);
                if (!group_by_key[key]) {
                    group_by_key[key] = {key, items: [], sample_href: text_from_value(item.href)};
                    group_keys.push(key);
                }
                group_by_key[key].items.push(item);
                total++;
            }

            group_keys.sort(function (a, b) {
                const rank_a = group_rank(a);
                const rank_b = group_rank(b);
                if (rank_a !== rank_b) {
                    return rank_a - rank_b;
                }
                return a.localeCompare(b);
            });

            const shown = group_keys.flatMap(key => group_by_key[key].items);

            list.innerHTML = '';

            const items_text = plural(total, '# item', '# items');
            const groups_text = plural(group_keys.length, '# group', '# groups');
            counts.textContent = `${items_text} · ${groups_text}`;
            meta.textContent = 'renderer-only · grouped by host';

            if (!total) {
                list.appendChild(make_elem('div', {class: 'empty', text: 'No items.'}));
                status.textContent = 'ready';
                return;
            }

            let index = 0;
            for (const key of group_keys) {
                const group = group_by_key[key];
                const section = make_elem('section', {class: 'group'});
                const header = make_elem('div', {class: 'group__hdr'});
                const left = make_elem('div', {class: 'group__name'});

                let host;
                if (key === 'other') {
                    host = 'Other';
                }
                else if (key === 'local') {
                    host = 'Local';
                }
                else {
                    host = key;
                }
                left.appendChild(make_elem('div', {class: 'group__host', text: host}));

                const sub = format_group_subtitle(key, group.sample_href);
                left.appendChild(make_elem('div', {class: 'group__sub', text: sub}));

                header.appendChild(left);
                header.appendChild(make_elem('div', {class: 'group__count', text: String(group.items.length)}));

                const rows = make_elem('div', {class: 'rows'});
                for (const item of group.items) {
                    const row = make_row(item, index);
                    if (item === current_item) {
                        row.classList.add('np-current');
                        row.querySelector('a').setAttribute('aria-current', 'true');
                    }
                    rows.appendChild(row);
                    index++;
                }

                section.appendChild(header);
                section.appendChild(rows);
                list.appendChild(section);
            }

            status.textContent = 'ready';
            navplace.order_set?.(shown);
        }

        function navplace_bind() {
            const input = document.getElementById('navplace-search') || document.querySelector('input[type="search"]');
            if (!input) {
                return;
            }

            try {
                if (typeof window.navplace === 'function') {
                    window.navplace({
                        input,
                        update: refresh_list,
                    });
                    status_flash('bound');
                }
                else {
                    status.textContent = 'navplace missing';
                }
            }
            catch {
                status.textContent = 'bind error';
            }
        }
    }
</script>
</body>
</html>
