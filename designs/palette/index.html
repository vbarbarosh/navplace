<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palette | NavPlace</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #eef0f3;
            --panel: #ffffff;
            --border: #dfe2e7;
            --text: #1c1f24;
            --text-soft: #5b616b;
            --text-mute: #969ca6;
            --accent: #2f6fde;
            --row-on: #e8f0fd;
            --key-bg: #f3f4f6;
            --shadow: 0 24px 60px -24px rgba(20, 24, 31, 0.35), 0 0 0 1px rgba(20, 24, 31, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                color-scheme: dark;
                --bg: #111317;
                --panel: #1b1e24;
                --border: #2b2f37;
                --text: #eceef2;
                --text-soft: #a3a9b4;
                --text-mute: #6c727d;
                --accent: #6ea2ff;
                --row-on: #233148;
                --key-bg: #262a32;
                --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            padding: 12vh 16px 32px;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .title {
            max-width: 640px;
            margin: 0 auto 10px;
            color: var(--text-mute);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .title:empty {
            display: none;
        }

        .panel {
            max-width: 640px;
            margin: 0 auto;
            border-radius: 14px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .search {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
        }

        .search svg {
            flex: none;
            width: 20px;
            height: 20px;
            color: var(--text-mute);
        }

        .search input {
            flex: 1;
            min-width: 0;
            height: 58px;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 20px;
        }

        .search input::placeholder {
            color: var(--text-mute);
        }

        .opens {
            padding: 8px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-soft);
            font-size: 13px;
        }

        .opens[hidden] {
            display: none;
        }

        .opens b {
            color: var(--text);
            font-weight: 600;
        }

        .rows {
            max-height: 412px;
            margin: 0;
            padding: 6px;
            overflow-y: auto;
            list-style: none;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 44px;
            padding: 0 12px;
            border-radius: 9px;
            cursor: pointer;
        }

        .row.on {
            background: var(--row-on);
        }

        .icon {
            display: grid;
            flex: none;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--key-bg);
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 700;
        }

        .icon img {
            width: 20px;
            height: 20px;
        }

        .label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            font-size: 15px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .domain {
            flex: none;
            max-width: 45%;
            overflow: hidden;
            color: var(--text-mute);
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row.on .domain {
            color: var(--text-soft);
        }

        .empty {
            padding: 22px 18px;
            color: var(--text-mute);
            text-align: center;
        }

        .empty[hidden] {
            display: none;
        }

        .foot {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px 16px;
            padding: 10px 18px;
            border-top: 1px solid var(--border);
            color: var(--text-mute);
            font-size: 12px;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        kbd {
            display: inline-block;
            min-width: 20px;
            margin-right: 4px;
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--key-bg);
            color: var(--text-soft);
            font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding-top: 16px;
            }

            .search input {
                height: 52px;
                font-size: 18px;
            }

            .domain {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="title" id="title"></div>
<div class="panel">
    <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Search your links…" autocomplete="off" spellcheck="false" aria-label="Search links">
    </label>
    <div class="opens" hidden></div>
    <ul class="rows" role="listbox" aria-label="Links"></ul>
    <div class="empty" hidden>No matches</div>
    <div class="foot">
        <span id="count"></span>
        <span class="keys"><span><kbd>↑</kbd><kbd>↓</kbd>move</span><span><kbd>Enter</kbd>open</span><span><kbd>Esc</kbd>clear</span></span>
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script src="/lib/plural.js"></script>
<script>
    let selected_index = 0;

    const input = document.querySelector('input[type=search]');
    const rows = document.querySelector('.rows');
    const empty = document.querySelector('.empty');
    const opens = document.querySelector('.opens');
    const count_element = document.getElementById('count');
    const items = [];

    main();

    function main()
    {
        navplace({
            input: input,
            meta: {title: '#title'},
            update: function (filtered) {
                items.splice(0, items.length, ...filtered);
                selected_index = 0;
                refresh_rows();
            },
            // Enter is ours: it opens the row the arrows chose, once
            navigate: function () {},
        });

        document.addEventListener('keydown', function (event) {
            if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            if ((event.key === 'ArrowDown') || (event.key === 'ArrowUp')) {
                event.preventDefault();
                selection_move((event.key === 'ArrowDown') ? 1 : -1);
            }
            else if (event.key === 'Enter') {
                event.preventDefault();
                item_open(selected_index);
            }
            else if (event.key === 'Escape') {
                event.preventDefault();
                input.value = '';
                input.dispatchEvent(new Event('input'));
            }
        });
    }

    function refresh_rows()
    {
        rows.replaceChildren(...items.map(make_row));
        empty.hidden = items.length > 0;
        count_element.textContent = plural(items.length, '# link', '# links');
        refresh_opens();
    }

    // With several words, Enter opens the top match of each, the last one as chosen
    function refresh_opens()
    {
        const list = navplace.selected_items.slice();
        if (items[selected_index]) {
            list.splice(-1, 1, items[selected_index]);
        }
        opens.hidden = list.length < 2;
        opens.replaceChildren('Enter opens ', ...list.flatMap(function (item, i) {
            const name_element = document.createElement('b');
            name_element.textContent = item.label;
            return i ? [', ', name_element] : [name_element];
        }));
    }

    function make_row(item, i)
    {
        const li = document.createElement('li');
        li.className = (i === selected_index) ? 'row on' : 'row';
        li.setAttribute('role', 'option');
        li.setAttribute('aria-selected', String(i === selected_index));
        li.append(make_icon(item), make_text('label', item.label), make_text('domain', domain_of(item.href)));
        li.addEventListener('mousemove', function () {
            if (selected_index !== i) {
                selected_index = i;
                refresh_selection();
            }
        });
        li.addEventListener('click', function () {
            item_open(i);
        });
        return li;
    }

    function make_icon(item)
    {
        const box = document.createElement('span');
        box.className = 'icon';
        box.textContent = (item.label || '?').trim().charAt(0).toUpperCase();
        if (item.icon_url) {
            const img = document.createElement('img');
            img.alt = '';
            img.src = item.icon_url;
            // The letter stays when the icon cannot be loaded
            img.addEventListener('load', () => box.replaceChildren(img));
        }
        return box;
    }

    function make_text(name, text)
    {
        const span = document.createElement('span');
        span.className = name;
        span.textContent = text;
        return span;
    }

    function domain_of(href)
    {
        try {
            return new URL(href).host.replace(/^www\./, '');
        }
        catch {
            return href;
        }
    }

    function selection_move(delta)
    {
        if (!items.length) {
            return;
        }
        selected_index = (selected_index + delta + items.length) % items.length;
        refresh_selection();
    }

    function refresh_selection()
    {
        for (const [i, li] of Array.from(rows.children).entries()) {
            li.classList.toggle('on', i === selected_index);
            li.setAttribute('aria-selected', String(i === selected_index));
        }
        rows.children[selected_index]?.scrollIntoView({block: 'nearest'});
        refresh_opens();
    }

    function item_open(i)
    {
        if (items[i]) {
            navplace.navigate(items[i]);
        }
    }
</script>
</body>
</html>
