<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Palette | NavPlace</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        /* Light on :root, dark on :root[data-theme="dark"]: /lib/theme_switch.js sets it */
        :root {
            color-scheme: light;
            --bg: #eef0f3;
            --panel: #ffffff;
            --border: #dfe2e7;
            --text: #1c1f24;
            --text-soft: #5b616b;
            --text-mute: #656b77;
            --accent: #2f6fde;
            --row-on: #e8f0fd;
            --key-bg: #f3f4f6;
            --shadow: 0 24px 60px -24px rgba(20, 24, 31, 0.35), 0 0 0 1px rgba(20, 24, 31, 0.06);
            --np-scrollbar-thumb: #c9ced6;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #111317;
            --panel: #1b1e24;
            --border: #2b2f37;
            --text: #eceef2;
            --text-soft: #a3a9b4;
            --text-mute: #818792;
            --accent: #6ea2ff;
            --row-on: #233148;
            --key-bg: #262a32;
            --shadow: 0 24px 60px -24px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
            --np-scrollbar-thumb: #3a3f4a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            padding: 12vh 16px 32px;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .title {
            max-width: 640px;
            margin: 0 auto 10px;
            color: var(--text-mute);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .title:empty {
            display: none;
        }

        .panel {
            max-width: 640px;
            margin: 0 auto;
            border-radius: 14px;
            overflow: hidden;
            background: var(--panel);
            box-shadow: var(--shadow);
        }

        .search {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 18px;
            border-bottom: 1px solid var(--border);
        }

        /* The keyboard is in the search box: an accent line under it */
        .search:focus-within {
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        .search svg {
            flex: none;
            width: 20px;
            height: 20px;
            color: var(--text-mute);
        }

        .search input {
            flex: 1;
            min-width: 0;
            height: 58px;
            padding: 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font: inherit;
            font-size: 20px;
        }

        .search input::placeholder {
            color: var(--text-mute);
        }

        .opens {
            padding: 8px 18px;
            border-bottom: 1px solid var(--border);
            color: var(--text-soft);
            font-size: 13px;
        }

        .opens[hidden] {
            display: none;
        }

        .opens b {
            color: var(--text);
            font-weight: 600;
        }

        .rows {
            max-height: 412px;
            margin: 0;
            padding: 6px;
            overflow-y: auto;
            list-style: none;
        }

        /* A row is its link */
        .row {
            display: flex;
            align-items: center;
            gap: 12px;
            height: 44px;
            padding: 0 12px;
            border-radius: 9px;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        /* The link ↑ and ↓ chose (lib/navplace.js); Enter opens it */
        .row.np-current {
            outline: none;
            background: var(--row-on);
        }

        .row:hover:not(.np-current) {
            background: color-mix(in srgb, var(--row-on) 50%, transparent);
        }

        /* The row Tab stands on shows the browser's own ring, the current row too */
        .row:focus-visible {
            outline: revert;
        }

        .icon {
            display: grid;
            flex: none;
            place-items: center;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            overflow: hidden;
            background: var(--key-bg);
            color: var(--text-soft);
            font-size: 12px;
            font-weight: 700;
        }

        .icon img {
            width: 20px;
            height: 20px;
        }

        .label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            font-size: 15px;
            font-weight: 500;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .domain {
            flex: none;
            max-width: 45%;
            overflow: hidden;
            color: var(--text-mute);
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .row.np-current .domain {
            color: var(--text-soft);
        }

        .empty {
            padding: 22px 18px;
            color: var(--text-mute);
            text-align: center;
        }

        .empty[hidden] {
            display: none;
        }

        .foot {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 6px 16px;
            padding: 10px 18px;
            border-top: 1px solid var(--border);
            color: var(--text-mute);
            font-size: 12px;
        }

        .keys {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .foot-end {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* /lib/theme_switch.js puts its button here, small, like the keys beside it */
        .foot [data-theme-switch] {
            display: flex;
            --np-switch-bg: var(--key-bg);
            --np-switch-fg: var(--text-soft);
            --np-switch-border: var(--border);
        }

        .foot .np-theme-switch {
            width: 24px;
            height: 24px;
        }

        .foot .np-theme-switch svg {
            width: 14px;
            height: 14px;
        }

        kbd {
            display: inline-block;
            min-width: 20px;
            margin-right: 4px;
            padding: 1px 5px;
            border-radius: 5px;
            background: var(--key-bg);
            color: var(--text-soft);
            font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding-top: 16px;
            }

            .search input {
                height: 52px;
                font-size: 18px;
            }

            .domain {
                display: none;
            }
        }
    </style>
</head>
<body>

<div class="title" id="title"></div>
<div class="panel">
    <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" placeholder="Search your links…" autocomplete="off" spellcheck="false" aria-label="Search links">
    </label>
    <div class="opens" hidden></div>
    <ul class="rows" aria-label="Links"></ul>
    <div class="empty" hidden>No matches</div>
    <div class="foot">
        <span id="count"></span>
        <span class="foot-end"><span class="keys"><span><kbd>↑</kbd><kbd>↓</kbd>move</span><span><kbd>Enter</kbd>open</span><span><kbd>Esc</kbd>clear</span></span><span data-theme-switch></span></span>
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script src="/lib/plural.js"></script>
<script>
    // The runtime's current link: ↑ ↓ and Enter are its own
    let current = 0;

    const input = document.querySelector('input[type=search]');
    const rows = document.querySelector('.rows');
    const empty = document.querySelector('.empty');
    const opens = document.querySelector('.opens');
    const count_element = document.getElementById('count');
    const items = [];

    main();

    function main()
    {
        navplace({
            input: input,
            meta: {title: '#title'},
            update: function (filtered, {current: index = 0} = {}) {
                items.splice(0, items.length, ...filtered);
                current = index;
                refresh_rows();
            },
        });

        document.addEventListener('keydown', function (event) {
            if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            if (event.key === 'Escape') {
                event.preventDefault();
                input.value = '';
                input.dispatchEvent(new Event('input'));
            }
        });
    }

    function refresh_rows()
    {
        rows.replaceChildren(...items.map(make_row));
        empty.hidden = items.length > 0;
        count_element.textContent = plural(items.length, '# link', '# links');
        refresh_opens();
    }

    // With several words, Enter opens the top match of each, the last one as chosen
    function refresh_opens()
    {
        const list = navplace.selected_items.slice();
        if (items[current]) {
            list.splice(-1, 1, items[current]);
        }
        opens.hidden = list.length < 2;
        opens.replaceChildren('Enter opens ', ...list.flatMap(function (item, i) {
            const name_element = document.createElement('b');
            name_element.textContent = item.label;
            return i ? [', ', name_element] : [name_element];
        }));
    }

    function make_row(item, i)
    {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.className = (i === current) ? 'row np-current' : 'row';
        link.href = item.href;
        if (i === current) {
            link.setAttribute('aria-current', 'true');
        }
        link.append(make_icon(item), make_text('label', item.label), make_text('domain', domain_of(item.href)));
        link.addEventListener('click', function (event) {
            item_open(i, event);
        });
        // The mouse picks a row as ↑ ↓ do: the runtime makes it the current one
        link.addEventListener('mousemove', function () {
            navplace.current_set?.(i);
        });
        li.append(link);
        return li;
    }

    function make_icon(item)
    {
        const box = document.createElement('span');
        box.className = 'icon';
        box.textContent = (item.label || '?').trim().charAt(0).toUpperCase();
        if (item.icon_url) {
            const img = document.createElement('img');
            img.alt = '';
            img.src = item.icon_url;
            // The letter stays when the icon cannot be loaded
            img.addEventListener('load', () => box.replaceChildren(img));
        }
        return box;
    }

    function make_text(name, text)
    {
        const span = document.createElement('span');
        span.className = name;
        span.textContent = text;
        return span;
    }

    function domain_of(href)
    {
        try {
            return new URL(href).host.replace(/^www\./, '');
        }
        catch {
            return href;
        }
    }

    // Through the runtime: every selected link, this one in place of the last. Ctrl, Shift and the
    // middle button on the row are left to the browser, as on any link
    function item_open(i, event)
    {
        if (items[i]) {
            navplace.navigate(items[i], event);
        }
    }
</script>
</body>
</html>
