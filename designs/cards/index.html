<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cards | NavPlace</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        /* Light on :root, dark on :root[data-theme="dark"]: /lib/theme_switch.js sets it */
        :root {
            color-scheme: light;
            --bg: #f5f7fa;
            --panel: #ffffff;
            --border: #e1e5eb;
            --text: #2c3e50;
            --text-soft: #5f6b7a;
            --text-mute: #8a94a3;
            --accent: #2575fc;
            --accent-soft: rgba(37, 117, 252, 0.1);
            --banner: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.1);
            --np-scrollbar-thumb: #c3cad6;
            --np-scrollbar-track: var(--bg);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0f1218;
            --panel: #191d25;
            --border: #2a2f39;
            --text: #e7ebf1;
            --text-soft: #a6aebb;
            --text-mute: #6e7685;
            --accent: #6ea2ff;
            --accent-soft: rgba(110, 162, 255, 0.14);
            --banner: linear-gradient(135deg, #4a0f8f 0%, #1a4fb3 100%);
            --shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 10px 25px rgba(0, 0, 0, 0.5);
            --np-scrollbar-thumb: #343b48;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            padding: 20px 16px 40px;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            position: relative;
            margin-bottom: 28px;
            padding: 32px 24px;
            border-radius: 12px;
            background: var(--banner);
            box-shadow: var(--shadow);
            color: #ffffff;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 34px;
            line-height: 1.2;
        }

        /* /lib/theme_switch.js puts its button here, on the banner */
        header [data-theme-switch] {
            position: absolute;
            top: 12px;
            right: 12px;
            --np-switch-border: rgba(255, 255, 255, 0.45);
            --np-switch-bg: rgba(255, 255, 255, 0.16);
            --np-switch-fg: #ffffff;
        }

        .subtitle {
            max-width: 640px;
            margin: 8px auto 0;
            font-size: 17px;
            opacity: 0.9;
        }

        .subtitle:empty {
            display: none;
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 24px;
        }

        .search {
            position: relative;
            flex: 1 1 320px;
            max-width: 480px;
        }

        .search svg {
            position: absolute;
            top: 50%;
            left: 16px;
            width: 18px;
            height: 18px;
            color: var(--text-mute);
            transform: translateY(-50%);
        }

        .search input {
            width: 100%;
            height: 48px;
            padding: 0 16px 0 44px;
            border: 2px solid var(--border);
            border-radius: 8px;
            outline: none;
            background: var(--panel);
            color: var(--text);
            font: inherit;
        }

        .search input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .chip {
            padding: 7px 16px;
            border: 2px solid var(--border);
            border-radius: 30px;
            background: var(--panel);
            color: var(--text-soft);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .chip.on {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .card {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 20px;
            border-left: 5px solid var(--accent);
            border-radius: 12px;
            background: var(--panel);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
        }

        /* The link ↑ and ↓ chose (lib/navplace.js); Enter opens it */
        .card.np-current {
            box-shadow: var(--shadow-hover);
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .head {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .icon {
            display: grid;
            flex: none;
            place-items: center;
            width: 40px;
            height: 40px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--accent-soft);
            color: var(--accent);
            font-size: 18px;
            font-weight: 700;
        }

        .icon img {
            width: 24px;
            height: 24px;
        }

        .names {
            min-width: 0;
        }

        .label {
            overflow: hidden;
            font-size: 18px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .domain {
            overflow: hidden;
            color: var(--accent);
            font-size: 14px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .section {
            align-self: flex-start;
            padding: 3px 10px;
            border-radius: 20px;
            background: var(--accent-soft);
            color: var(--text-soft);
            font-size: 13px;
            font-weight: 600;
        }

        .section:empty {
            display: none;
        }

        .empty {
            padding: 40px 0;
            color: var(--text-mute);
            text-align: center;
        }

        .empty[hidden] {
            display: none;
        }

        @media (max-width: 560px) {
            header {
                padding: 22px 16px;
            }

            h1 {
                font-size: 26px;
            }

            .search {
                flex-basis: 100%;
                max-width: none;
            }

            .grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <header>
        <span data-theme-switch></span>
        <h1 id="title">My links</h1>
        <p class="subtitle" id="subtitle"></p>
    </header>
    <div class="tools">
        <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" placeholder="Search links…" autocomplete="off" spellcheck="false" aria-label="Search links">
        </label>
        <div class="chips" role="group" aria-label="Sections"></div>
    </div>
    <ul class="grid" aria-label="Links"></ul>
    <div class="empty" hidden>No matches</div>
</div>

<script src="/lib/navplace.js"></script>
<script>
    let shown = [];
    let section = null;
    // The runtime's current link: ↑ ↓ and Enter are its own
    let current_item = null;

    const input = document.querySelector('input[type=search]');
    const grid = document.querySelector('.grid');
    const chips = document.querySelector('.chips');
    const empty = document.querySelector('.empty');
    const matches = [];

    main();

    function main()
    {
        navplace({
            input: input,
            meta: {title: '#title', subtitle: '#subtitle'},
            update: function (filtered, {item = null} = {}) {
                matches.splice(0, matches.length, ...filtered);
                current_item = item;
                refresh_grid();
            },
        });

        document.addEventListener('keydown', function (event) {
            if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            if (event.key === 'Escape') {
                event.preventDefault();
                input.value = '';
                input.dispatchEvent(new Event('input'));
            }
        });
    }

    function refresh_grid()
    {
        refresh_chips();
        shown = section ? matches.filter(v => v.namespaces.includes(section)) : matches.slice();
        grid.replaceChildren(...shown.map(make_card));
        empty.hidden = shown.length > 0;
        // ↑ ↓ and Enter walk the cards of the section picked, not the hidden ones
        navplace.order_set?.(shown);
    }

    // One chip per section of the links, in the order they first appear;
    // with nothing typed the matches are all the links, so the chips follow them
    function refresh_chips()
    {
        if (input.value.trim() && chips.childElementCount) {
            return;
        }
        const names = [];
        for (const item of matches) {
            for (const name of item.namespaces) {
                if (!names.includes(name)) {
                    names.push(name);
                }
            }
        }
        if (!names.includes(section)) {
            section = null;
        }
        if (!names.length) {
            chips.replaceChildren();
            return;
        }
        chips.replaceChildren(...[null, ...names].map(function (name) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = (name === section) ? 'chip on' : 'chip';
            button.textContent = name ?? 'All';
            button.addEventListener('click', function () {
                section = name;
                for (const chip of chips.children) {
                    chip.classList.toggle('on', chip === button);
                }
                refresh_grid();
                input.focus();
            });
            return button;
        }));
    }

    function make_card(item, i)
    {
        const li = document.createElement('li');
        li.className = (item === current_item) ? 'card np-current' : 'card';
        const head = document.createElement('div');
        head.className = 'head';
        const names_element = document.createElement('div');
        names_element.className = 'names';
        names_element.append(make_text('div', 'label', item.label), make_text('div', 'domain', domain_of(item.href)));
        head.append(make_icon(item), names_element);
        li.append(head, make_text('span', 'section', item.namespaces.join(' · ')));
        li.addEventListener('click', function () {
            item_open(i);
        });
        return li;
    }

    function make_icon(item)
    {
        const box = document.createElement('span');
        box.className = 'icon';
        box.textContent = (item.label || '?').trim().charAt(0).toUpperCase();
        if (item.icon_url) {
            const img = document.createElement('img');
            img.alt = '';
            img.src = item.icon_url;
            // The letter stays when the icon cannot be loaded
            img.addEventListener('load', () => box.replaceChildren(img));
        }
        return box;
    }

    function make_text(tag, name, text)
    {
        const elem = document.createElement(tag);
        elem.className = name;
        elem.textContent = text;
        return elem;
    }

    function domain_of(href)
    {
        try {
            return new URL(href).host.replace(/^www\./, '');
        }
        catch {
            return href;
        }
    }

    function item_open(i)
    {
        if (shown[i]) {
            navplace.navigate(shown[i]);
        }
    }
</script>
</body>
</html>
