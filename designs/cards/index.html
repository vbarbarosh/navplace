<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cards | NavPlace</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        /* Index cards on a desk: square corners, a hard shadow, and a colour for each section of the
           links, on its chip and along the top of its cards. */

        /* Light on :root, dark on :root[data-theme="dark"]: /lib/theme_switch.js sets it */
        :root {
            color-scheme: light;
            --bg: #f1eee6;
            --panel: #fffdf8;
            --ink: #1d1b16;
            --line: #c9c3b6;
            --text: #1d1b16;
            --text-soft: #5a554a;
            --text-mute: #6f6a5e;
            --accent: #1d5fd0;
            --shadow: #d3cdbf;
            --on-tone: #ffffff;
            /* A section's colour, the first six sections each their own, then round again */
            --tone-0: #1d5fd0;
            --tone-1: #c2410c;
            --tone-2: #15803d;
            --tone-3: #a16207;
            --tone-4: #7e22ce;
            --tone-5: #0f766e;
            --np-scrollbar-thumb: #b9b2a3;
            --np-scrollbar-track: var(--bg);
            --np-switch-border: var(--ink);
            --np-switch-bg: var(--panel);
            --np-switch-fg: var(--ink);
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #131416;
            --panel: #1d1f23;
            --ink: #ece8df;
            --line: #3d4047;
            --text: #ece8df;
            --text-soft: #b4b0a6;
            --text-mute: #8f8b82;
            --accent: #7aa7ff;
            --shadow: #050506;
            --on-tone: #131416;
            --tone-0: #7aa7ff;
            --tone-1: #ff8a5c;
            --tone-2: #5fd08a;
            --tone-3: #f0b443;
            --tone-4: #c4a1ff;
            --tone-5: #4fd1c5;
            --np-scrollbar-thumb: #3d4047;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
        }

        body {
            padding: 28px 20px 48px;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
        }

        /* The title over a thick rule, the theme switch at its right end */
        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
            padding-bottom: 14px;
            border-bottom: 4px solid var(--ink);
        }

        .titles {
            min-width: 0;
        }

        h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.02em;
            overflow-wrap: anywhere;
        }

        .subtitle {
            margin: 6px 0 0;
            color: var(--text-soft);
            font-size: 16px;
        }

        .subtitle:empty {
            display: none;
        }

        /* /lib/theme_switch.js puts its button here: square, as everything on this page */
        header [data-theme-switch] {
            flex: none;
        }

        header .np-theme-switch {
            border-radius: 0;
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 26px;
        }

        .search {
            position: relative;
            flex: 1 1 320px;
            max-width: 440px;
        }

        .search svg {
            position: absolute;
            top: 50%;
            left: 14px;
            width: 18px;
            height: 18px;
            color: var(--text-mute);
            transform: translateY(-50%);
        }

        .search input {
            width: 100%;
            height: 44px;
            padding: 0 14px 0 42px;
            border: 2px solid var(--ink);
            border-radius: 0;
            outline: none;
            background: var(--panel);
            color: var(--text);
            font: inherit;
        }

        .search input:focus {
            border-color: var(--accent);
            box-shadow: 4px 4px 0 var(--shadow);
        }

        .search input::placeholder {
            color: var(--text-mute);
        }

        /* A section's colour reaches its chip and its cards through --tone */
        .chip,
        .card {
            --tone: var(--text-mute);
        }

        [data-tone="0"] {
            --tone: var(--tone-0);
        }

        [data-tone="1"] {
            --tone: var(--tone-1);
        }

        [data-tone="2"] {
            --tone: var(--tone-2);
        }

        [data-tone="3"] {
            --tone: var(--tone-3);
        }

        [data-tone="4"] {
            --tone: var(--tone-4);
        }

        [data-tone="5"] {
            --tone: var(--tone-5);
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* A chip is a tab with its section's colour as a small square; All has the ink's */
        .chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border: 2px solid var(--line);
            border-radius: 0;
            background: var(--panel);
            color: var(--text-soft);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .chip:not([data-tone]) {
            --tone: var(--ink);
        }

        .chip::before {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--tone);
        }

        .chip:hover {
            border-color: var(--tone);
            color: var(--text);
        }

        /* The chosen chip is filled with its colour */
        .chip.on {
            border-color: var(--tone);
            background: var(--tone);
            color: var(--on-tone);
        }

        .chip.on::before {
            background: var(--on-tone);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        /* A card is its link, as tall as the row of cards it stands in: its section's colour
           along the top, a hard shadow under it */
        .card {
            display: flex;
            flex-direction: column;
            gap: 16px;
            height: 100%;
            padding: 16px 18px 12px;
            border: 1px solid var(--line);
            border-top: 6px solid var(--tone);
            background: var(--panel);
            box-shadow: 4px 4px 0 var(--shadow);
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: box-shadow 0.12s;
        }

        .card:hover {
            box-shadow: 6px 6px 0 var(--shadow);
        }

        /* The link ↑ and ↓ chose (lib/navplace.js); Enter opens it: its shadow in the section's
           colour, the ink around it. It stays in its place: nothing on the page moves */
        .card.np-current {
            border-color: var(--ink);
            border-top-color: var(--tone);
            box-shadow: 6px 6px 0 var(--tone);
            outline: 2px solid var(--ink);
            outline-offset: -1px;
        }

        /* The card Tab stands on shows the browser's own ring, the current card too */
        .card:focus-visible {
            outline: revert;
        }

        .head {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .icon {
            display: grid;
            flex: none;
            place-items: center;
            width: 40px;
            height: 40px;
            border: 1px solid var(--line);
            overflow: hidden;
            background: var(--bg);
            color: var(--tone);
            font-size: 18px;
            font-weight: 700;
        }

        .icon img {
            width: 24px;
            height: 24px;
        }

        .names {
            min-width: 0;
        }

        .label {
            overflow: hidden;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.3;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .domain {
            overflow: hidden;
            color: var(--text-mute);
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 13px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* The section's name under a ruled line, as on an index card */
        .section {
            margin-top: auto;
            padding-top: 9px;
            border-top: 1px dashed var(--line);
            color: var(--tone);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .section:empty {
            display: none;
        }

        .empty {
            padding: 40px 0;
            color: var(--text-mute);
            text-align: center;
        }

        .empty[hidden] {
            display: none;
        }

        @media (max-width: 560px) {
            body {
                padding: 18px 14px 36px;
            }

            h1 {
                font-size: 28px;
            }

            .search {
                flex-basis: 100%;
                max-width: none;
            }

            .grid {
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
            }
        }
    </style>
</head>
<body>

<div class="page">
    <header>
        <div class="titles">
            <h1 id="title">My links</h1>
            <p class="subtitle" id="subtitle"></p>
        </div>
        <span data-theme-switch></span>
    </header>
    <div class="tools">
        <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input type="search" placeholder="Search links…" autocomplete="off" spellcheck="false" aria-label="Search links">
        </label>
        <div class="chips" role="group" aria-label="Sections"></div>
    </div>
    <ul class="grid" aria-label="Links"></ul>
    <div class="empty" hidden>No matches</div>
</div>

<script src="/lib/navplace.js"></script>
<script>
    let shown = [];
    let section = null;
    // The runtime's current link: ↑ ↓ and Enter are its own
    let current_item = null;

    const input = document.querySelector('input[type=search]');
    const grid = document.querySelector('.grid');
    const chips = document.querySelector('.chips');
    const empty = document.querySelector('.empty');
    const matches = [];
    // The colour of each section, 0 to 5 by its place among the sections (the --tone-* of the styles)
    const tone_by_section = new Map();
    // The sections the chips are drawn for, as one text: the chips are made again only when it changes
    let chips_drawn = null;

    main();

    function main()
    {
        navplace({
            input: input,
            meta: {title: '#title', subtitle: '#subtitle'},
            update: function (filtered, {item = null} = {}) {
                matches.splice(0, matches.length, ...filtered);
                current_item = item;
                refresh_grid();
            },
        });

        document.addEventListener('keydown', function (event) {
            if (event.isComposing || event.ctrlKey || event.metaKey || event.altKey) {
                return;
            }
            if (event.key === 'Escape') {
                event.preventDefault();
                input.value = '';
                input.dispatchEvent(new Event('input'));
            }
        });
    }

    function refresh_grid()
    {
        refresh_chips();
        const next = section ? matches.filter(v => v.namespaces.includes(section)) : matches.slice();
        // The same cards as are drawn, ↑ or ↓ moved the mark: they stay as they are, pictures and
        // all, and only the mark moves
        if (next.length && (next.length === shown.length) && (grid.childElementCount === next.length) && next.every((v, i) => v === shown[i])) {
            for (const [i, li] of Array.from(grid.children).entries()) {
                li.firstElementChild.classList.toggle('np-current', next[i] === current_item);
            }
            return;
        }
        shown = next;
        grid.replaceChildren(...shown.map(make_card));
        empty.hidden = shown.length > 0;
        // A search that finds nothing is told apart from a file with no links by the search box
        empty.textContent = input.value.trim() ? 'No matches' : 'No links yet';
        // ↑ ↓ and Enter walk the cards of the section picked, not the hidden ones
        navplace.order_set?.(shown);
    }

    // One chip per section of the links, in the order they first appear;
    // with nothing typed the matches are all the links, so the chips follow them
    function refresh_chips()
    {
        if (input.value.trim() && chips.childElementCount) {
            return;
        }
        const names = [];
        for (const item of matches) {
            for (const name of item.namespaces) {
                if (!names.includes(name)) {
                    names.push(name);
                }
            }
        }
        if (!names.includes(section)) {
            section = null;
        }
        // The same sections as the chips show: they stay as they are
        if (chips_drawn === JSON.stringify(names)) {
            return;
        }
        chips_drawn = JSON.stringify(names);
        tone_by_section.clear();
        for (const [i, name] of names.entries()) {
            tone_by_section.set(name, i % 6);
        }
        if (!names.length) {
            chips.replaceChildren();
            return;
        }
        chips.replaceChildren(...[null, ...names].map(function (name) {
            const button = document.createElement('button');
            button.type = 'button';
            button.className = (name === section) ? 'chip on' : 'chip';
            button.textContent = name ?? 'All';
            if (name !== null) {
                button.dataset.tone = tone_by_section.get(name);
            }
            button.addEventListener('click', function () {
                section = name;
                for (const chip of chips.children) {
                    chip.classList.toggle('on', chip === button);
                }
                refresh_grid();
                input.focus();
            });
            return button;
        }));
    }

    function make_card(item, i)
    {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.className = (item === current_item) ? 'card np-current' : 'card';
        link.href = item.href;
        // A card takes the colour of its first section; one with no section stays plain
        if (tone_by_section.has(item.namespaces[0])) {
            link.dataset.tone = tone_by_section.get(item.namespaces[0]);
        }
        const head = document.createElement('div');
        head.className = 'head';
        const names_element = document.createElement('div');
        names_element.className = 'names';
        // A name too long for its card is cut with an ellipsis: its full text is in the title
        const label_element = make_text('div', 'label', item.label);
        label_element.title = item.label;
        names_element.append(label_element, make_text('div', 'domain', domain_of(item.href)));
        head.append(make_icon(item), names_element);
        link.append(head, make_text('span', 'section', item.namespaces.join(' · ')));
        link.addEventListener('click', function (event) {
            item_open(i, event);
        });
        li.append(link);
        return li;
    }

    function make_icon(item)
    {
        const box = document.createElement('span');
        box.className = 'icon';
        // The first letter or digit of the name, ? for a name with none: a name may open with an
        // emoji or a mark, and half an emoji is no character
        box.textContent = (String(item.label).match(/[\p{L}\p{N}]/u)?.[0] ?? '?').toUpperCase();
        if (item.icon_url) {
            const img = document.createElement('img');
            img.alt = '';
            img.src = item.icon_url;
            // An icon the page has loaded before is there at once, with no letter shown in between
            if (img.complete && (img.naturalWidth > 0)) {
                box.replaceChildren(img);
            }
            else {
                // The letter stays when the icon cannot be loaded
                img.addEventListener('load', () => box.replaceChildren(img));
            }
        }
        return box;
    }

    function make_text(tag, name, text)
    {
        const elem = document.createElement(tag);
        elem.className = name;
        elem.textContent = text;
        return elem;
    }

    function domain_of(href)
    {
        try {
            return new URL(href).host.replace(/^www\./, '');
        }
        catch {
            return href;
        }
    }

    // Through the runtime: every selected link, this one in place of the last. Ctrl, Shift and the
    // middle button on the card are left to the browser, as on any link
    function item_open(i, event)
    {
        if (shown[i]) {
            navplace.navigate(shown[i], event);
        }
    }
</script>
</body>
</html>
