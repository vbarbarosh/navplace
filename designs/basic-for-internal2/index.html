<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPlace Operational Theme</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f4f4f5;
            --text-primary: #18181b;
            --text-secondary: #71717a;
            --border: #e4e4e7;
            --accent: #2563eb;
            --hover: #f1f5f9;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            --np-scrollbar-thumb: #a1a1aa;
            --np-scrollbar-track: #f4f4f5;
            --np-switch-bg: var(--bg-secondary);
            --np-switch-fg: var(--text-primary);
            --np-switch-border: var(--border);
        }

        /* The dark theme: /lib/theme_switch.js sets it and shows the switch */
        :root[data-theme="dark"] {
            --bg-primary: #09090b;
            --bg-secondary: #18181b;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --border: #27272a;
            --accent: #3b82f6;
            --hover: #1e1e21;
            --np-scrollbar-thumb: #3f3f46;
            --np-scrollbar-track: #09090b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-size: 13px;
            line-height: 1.4;
        }

        .ops-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 1rem;
        }

        .search-wrapper {
            flex-grow: 1;
            max-width: 400px;
        }

        input[type="search"] {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 6px 10px;
            border-radius: 4px;
            outline: none;
            font-family: var(--font-mono);
        }

        input[type="search"]:focus {
            border-color: var(--accent);
        }

        .theme-toggle {
            display: flex;
            margin-left: 1rem;
        }

        .theme-toggle .np-theme-switch {
            width: 28px;
            height: 28px;
            border-radius: 4px;
        }

        /* Grid Results */
        #navplace-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1px;
            background-color: var(--border);
            border: 1px solid var(--border);
        }

        .nav-item {
            background-color: var(--bg-primary);
            display: flex;
            align-items: center;
            padding: 8px 12px;
            text-decoration: none;
            color: inherit;
            transition: background 0.1s ease;
        }

        .nav-item:hover {
            background-color: var(--hover);
        }

        .nav-icon {
            width: 16px;
            height: 16px;
            margin-right: 12px;
            flex-shrink: 0;
            filter: grayscale(1);
        }

        .nav-item:hover .nav-icon {
            filter: none;
        }

        /* The link ↑ and ↓ move to (lib/navplace.js): the hover look, with an accent bar on its left */
        .nav-item.np-current {
            outline: none;
            background-color: var(--hover);
            box-shadow: inset 3px 0 0 var(--accent);
        }

        .nav-item.np-current .nav-icon {
            filter: none;
        }

        .nav-content {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .nav-label {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-href {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav-image {
            width: 32px;
            height: 32px;
            margin-left: auto;
            border-radius: 2px;
            object-fit: cover;
            border: 1px solid var(--border);
        }

        .empty-state {
            grid-column: 1 / -1;
            padding: 40px;
            text-align: center;
            background: var(--bg-primary);
            color: var(--text-secondary);
            font-family: var(--font-mono);
        }

        @media (max-width: 600px) {
            #navplace-results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="ops-container">
    <header>
        <div class="search-wrapper">
            <input type="search" id="ops-search" placeholder="Filter operational nodes..." spellcheck="false">
        </div>
        <span class="theme-toggle" data-theme-switch></span>
    </header>

    <main id="navplace-results">
        <div class="empty-state">System standby. Awaiting input...</div>
    </main>
</div>

<script src="/lib/navplace.js"></script>
<script>
    const results_container = document.getElementById('navplace-results');

    // The links as they are drawn, a card each, in the same order
    let shown_items = [];

    main();

    function main()
    {
        if (typeof navplace === 'function') {
            navplace({input: '#ops-search', update: refresh_items});
            // A click on a card opens its link through the runtime: every selected link, the
            // clicked one in place of the last
            results_container.addEventListener('click', function (event) {
                const card = event.target.closest('.nav-item');
                const item = card ? shown_items[Array.from(results_container.children).indexOf(card)] : null;
                if (item) {
                    navplace.navigate(item, event);
                }
            });
        }
        else {
            console.error('NavPlace runtime not detected.');
        }
    }

    function refresh_items(items, {current} = {})
    {
        shown_items = items || [];
        if (!items || (items.length === 0)) {
            results_container.innerHTML = '<div class="empty-state">No matching operational records found.</div>';
            return;
        }

        results_container.innerHTML = items.map((item, i) => render_item_html(item, i === current)).join('');

        function render_item_html(item, is_current) {
            return `
            <a href="${html_escape(item.href)}" class="nav-item ${is_current ? 'np-current' : ''}" target="_blank" rel="noopener noreferrer">
                <img src="${html_escape(item.icon_url)}" class="nav-icon" onerror="this.style.display='none'">
                <div class="nav-content">
                    <span class="nav-label">${html_escape(item.label)}</span>
                    <span class="nav-href">${html_escape(item.href)}</span>
                </div>
                ${item.image_url ? `<img src="${html_escape(item.image_url)}" class="nav-image">` : ''}
            </a>
        `;
        }
    }

    // The links file is not trusted: every value from it goes into the HTML through this,
    // an attribute's value too
    function html_escape(text)
    {
        return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
</script>

</body>
</html>
