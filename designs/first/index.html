<!DOCTYPE html>
<!-- The very first NavPlace page: the CodePen "Bookmarks" (codepen.io/vbarbarosh/pen/vEENLwL), kept with its links in links.txt -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>First | NavPlace</title>
    <link href="../../lib/vendor/smcss-2/reset.css" rel="stylesheet">
    <link href="../../lib/vendor/smcss-2/sm.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
</head>
<body>

<div id="app"></div>

<script src="../../lib/vendor/vue-3/vue.global.prod.js"></script>
<script src="../../lib/navplace.js"></script>
<script>
const app = Vue.createApp({
    template: `
<div class="fix-f vsplit bg-page">
<div class="p10">
    <input ref="search" class="search db ma ph10 pv5 h20 w400" />
</div>
<div class="fluid flex-row-center p10 oa">
    <div class="ma flex-fluid container gap25">
        <a v-for="(item, i) in items"
           v-bind:href="item.href"
           v-bind:class="{break: row_starts(i)}"
           target="_blank"
           class="rel flex-col w200 bs10 bg-bookmark"
           style="height:112px;">
            <template v-if="picture_shown(item)">
                <img v-if="(item.meta.padding === '1')" v-bind:src="item.image_url" v-on:error="picture_failed(item)" class="flex-fluid fit-contain" style="padding: 10px 0 35px;" />
                <img v-else-if="(item.meta.padding === '2')" v-bind:src="item.image_url" v-on:error="picture_failed(item)" class="flex-fluid fit-contain" style="padding: 0 10px 15px;" />
                <img v-else v-bind:src="item.image_url" v-on:error="picture_failed(item)" class="flex-fluid fit-cover" />
            </template>
            <span v-else class="flex-fluid flex-row-center" style="padding-bottom: 28px;">
                <img v-bind:src="item.icon_url" class="fit-contain" style="width: 48px; height: 48px;" />
            </span>
            <span class="bookmark-label">{{ item.label }}</span>
        </a>
    </div>
</div>
</div>
`,
    data: function () {
        return {
            items: [],
            // Pictures that did not load: their links show the site's icon instead
            failed: {},
        };
    },
    methods: {
        // A link under another # section than the one before it starts a new row
        row_starts: function (i) {
            return (i > 0) && (this.items[i].namespaces.join('|') !== this.items[i - 1].namespaces.join('|'));
        },
        picture_shown: function (item) {
            return !!item.image_url && !this.failed[item.image_url];
        },
        picture_failed: function (item) {
            this.failed[item.image_url] = true;
        },
    },
    mounted: function () {
        navplace({
            input: this.$refs.search,
            update: items => this.items.splice(0, this.items.length, ...items),
        });
    },
});
app.mixin({
    methods: {
        px,
        pc,
    },
});
app.mount('#app');
function px(v) {
    return v ? `${v}px` : '0';
}
function pc(v) {
    return v ? `${v*100}%` : '0';
}
</script>

</body>
</html>
