<!DOCTYPE html>
<!-- The very first NavPlace page: the CodePen "Bookmarks" (codepen.io/vbarbarosh/pen/vEENLwL), kept with its links in links.txt -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>First | NavPlace</title>
    <link href="/lib/vendor/smcss-2/reset.css" rel="stylesheet">
    <link href="/lib/vendor/smcss-2/sm.css" rel="stylesheet">
    <script src="/lib/theme_switch.js"></script>
    <link href="theme.css" rel="stylesheet">
</head>
<body>

<div id="app"></div>

<script src="/lib/vendor/vue-3/vue.global.prod.js"></script>
<script src="/lib/navplace.js"></script>
<script>
main();

function main()
{
    const app = Vue.createApp({
        template: `
<div class="fix-f vsplit bg-page">
<div class="p10 search-row">
    <span></span>
    <input ref="search" type="search" placeholder="Search…" class="search" />
    <span data-theme-switch></span>
</div>
<div class="fluid flex-row-center p10 oa">
    <div class="flex-fluid ma container">
        <a v-for="(item, i) in items"
           v-on:click="click_bookmark(item, $event)"
           v-bind:href="item.href"
           v-bind:class="{break: row_starts(i), 'np-current': (i === current)}"
           target="_blank"
           style="height:112px;"
           class="rel flex-col w200 bs10 bg-bookmark">
            <template v-if="is_picture_shown(item)">
                <img v-if="(item.meta.padding === '1')" v-on:error="picture_mark_failed(item)" v-bind:src="item.image_url" style="padding: 10px 0 35px;" class="flex-fluid fit-contain" />
                <img v-else-if="(item.meta.padding === '2')" v-on:error="picture_mark_failed(item)" v-bind:src="item.image_url" style="padding: 0 10px 15px;" class="flex-fluid fit-contain" />
                <img v-else v-on:error="picture_mark_failed(item)" v-bind:src="item.image_url" class="flex-fluid fit-cover" />
            </template>
            <span v-else style="padding-bottom: 28px;" class="flex-fluid flex-row-center">
                <img v-bind:src="item.icon_url" style="width: 48px; height: 48px;" class="fit-contain" />
            </span>
            <span v-bind:title="item.label" class="bookmark-label">{{ item.label }}</span>
        </a>
        <div v-if="empty_note" class="empty-note">{{ empty_note }}</div>
    </div>
</div>
</div>
`,
        data: function () {
            return {
                items: [],
                // The link ↑ ↓ moved to, which Enter opens: navplace.js keeps it
                current: 0,
                // Pictures that did not load: their links show the site's icon instead
                failed: {},
                // The line in place of the bookmarks when there are none; nothing until the links come
                empty_note: '',
            };
        },
        methods: {
            // A link under another # section than the one before it starts a new row
            row_starts: function (i) {
                return (i > 0) && (this.items[i].namespaces.join('|') !== this.items[i - 1].namespaces.join('|'));
            },
            is_picture_shown: function (item) {
                return !!item.image_url && !this.failed[item.image_url];
            },
            picture_mark_failed: function (item) {
                this.failed[item.image_url] = true;
            },
            // A click opens through the runtime: every selected link, this one in place of the last
            click_bookmark: function (item, event) {
                navplace.navigate(item, event);
            },
        },
        mounted: function () {
            navplace({
                input: this.$refs.search,
                update: (v, {current = 0} = {}) => {
                    this.items.splice(0, this.items.length, ...v);
                    this.current = current;
                    this.empty_note = v.length ? '' : (this.$refs.search.value.trim() ? 'Nothing found' : 'No links yet');
                },
            });
        },
    });
    app.mixin({methods: {px, pc}});
    app.mount('#app');
}

function px(value)
{
    return value ? `${value}px` : '0';
}

function pc(value)
{
    return value ? `${value*100}%` : '0';
}
</script>

</body>
</html>
