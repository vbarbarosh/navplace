<!doctype html>
<!-- A departures board: a row for each link, its name as the destination, its section as the gate -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Board | NavPlace</title>
    <script src="/lib/theme_switch.js"></script>
    <link href="theme.css" rel="stylesheet">
</head>
<body>
<div class="board">

    <header>
        <h1>Departures</h1>
        <input id="search" type="search" placeholder="Type to find" autocomplete="off" spellcheck="false" aria-label="Search">
    </header>

    <div class="head" aria-hidden="true">
        <span>No</span>
        <span>Destination</span>
        <span class="via">Via</span>
        <span class="gate">Gate</span>
    </div>
    <div id="rows" class="rows"></div>
    <p id="empty" class="empty" hidden></p>

    <div class="foot">
        <span id="count"></span>
        <span class="keys">↑↓ move · enter open · esc clear</span>
        <span data-theme-switch></span>
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script>
main();

function main()
{
    const input = document.getElementById('search');
    const rows = document.getElementById('rows');
    const empty = document.getElementById('empty');
    const count = document.getElementById('count');
    // The links drawn now, in their order on the page, and the row of each
    let drawn = [];
    let drawn_rows = [];

    navplace({
        input: input,
        meta: {title: 'h1'},
        update: (v, {item = null} = {}) => refresh_rows(v, item),
    });

    // Esc empties the search box
    document.addEventListener('keydown', function (event) {
        if ((event.key === 'Escape') && !event.isComposing) {
            event.preventDefault();
            input.value = '';
            input.dispatchEvent(new Event('input', {bubbles: true}));
        }
    });

    // `current_item`: the link ↑ and ↓ chose (lib/navplace.js), the one Enter opens
    function refresh_rows(items, current_item) {
        // The same links as are drawn, ↑ or ↓ moved the mark: the rows stay and only the mark moves
        if (items.length && (items.length === drawn.length) && items.every((v, i) => v === drawn[i])) {
            for (const [i, row] of drawn_rows.entries()) {
                row.classList.toggle('np-current', items[i] === current_item);
            }
            return;
        }
        drawn = items.slice();
        drawn_rows = items.map((v, i) => make_row(v, i, v === current_item));
        rows.replaceChildren(...drawn_rows);
        count.textContent = `${items.length} ${(items.length === 1) ? 'link' : 'links'}`;
        // No link to show: a search that finds nothing is told apart from a file with no links by the search box
        empty.hidden = (items.length > 0);
        empty.textContent = input.value.trim() ? 'Nothing found' : 'No links yet';
    }

    // The links file is not trusted: its text enters as text or a set attribute, never as HTML
    function make_row(item, i, is_current) {
        const row = document.createElement('a');
        row.className = is_current ? 'row np-current' : 'row';
        row.href = item.href;
        // A name too long for its cell is cut with an ellipsis: its full text is in the title
        row.title = item.label;
        row.append(
            make_text('no', String(i + 1).padStart(2, '0')),
            make_text('to', item.label),
            make_text('via', address_from_href(item.href)),
            make_text('gate', item.namespaces[0] ?? '·'),
        );
        row.addEventListener('click', function (event) {
            navplace.navigate(item, event);
        });
        return row;
    }

    function make_text(name, text) {
        const out = document.createElement('span');
        out.className = name;
        out.textContent = text;
        return out;
    }

    // The address without its scheme and its last slash, so its telling part comes first
    function address_from_href(href) {
        return String(href).replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
    }
}
</script>
</body>
</html>
