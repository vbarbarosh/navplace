<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Google Chrome Theme | NavPlace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/lib/vendor/smcss-2/sm.css" rel="stylesheet">
    <script src="/lib/theme_switch.js"></script>
    <link href="theme.css" rel="stylesheet">
</head>
<body>

<div id="app"></div>

<script src="/lib/vendor/vue-3/vue.global.prod.js"></script>
<script src="/lib/navplace.js"></script>
<script>
main();

function main()
{
    const app = Vue.createApp({
        template: `
            <div class="page">

                <!-- SEARCH -->
                <div class="search-wrap">
                    <div class="search">
                        <!-- magnifier -->
                        <svg viewBox="0 0 24 24">
                            <path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zM10 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" />
                        </svg>
                        <input ref="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" aria-label="Search links" />
                    </div>
                </div>

                <!-- SHORTCUTS -->
                <div class="shortcuts">

                    <a v-for="(item, i) in items" v-on:click="click_tile(item, $event)" v-bind:href="item.href" v-bind:class="{'np-current': i === current}" class="tile">
                        <span v-bind:data-letter="letter_from_item(item)" class="tile-inner">
                            <img v-if="item.icon_url" v-on:error="error_icon(item)" v-on:load="load_icon(item)" v-bind:src="item.icon_url" alt="" />
                        </span>
                        <span class="tile-label">{{ item.label }}</span>
                    </a>

                </div>

                <!-- NOTHING TO SHOW -->
                <div v-if="empty_text" class="empty">{{ empty_text }}</div>
            </div>
        `,
        data: function () {
            // current: the link ↑ ↓ moved to, kept by the runtime; Enter opens it
            // empty_text: what the page says when it has no link to show
            // failed_icons: true under the address of an icon that could not be loaded
            return {items: [], current: 0, empty_text: '', failed_icons: {}};
        },
        methods: {
            // A click opens through the runtime: every selected link, this one in place of the last
            click_tile: function (item, event) {
                navplace.navigate(item, event);
            },
            error_icon: function (item) {
                this.failed_icons[item.icon_url] = true;
            },
            load_icon: function (item) {
                delete this.failed_icons[item.icon_url];
            },
            // A link whose icon could not be loaded shows the first letter or digit of its name in
            // its tile (.tile-inner[data-letter] in theme.css), ? for a name that has none
            letter_from_item: function (item) {
                if (!this.failed_icons[item.icon_url]) {
                    return null;
                }
                return (String(item.label).match(/[\p{L}\p{N}]/u)?.[0] ?? '?').toUpperCase();
            },
        },
        mounted: function () {
            navplace({
                input: this.$refs.search,
                update: (v, {current} = {}) => {
                    this.items.splice(0, this.items.length, ...v);
                    this.current = current ?? 0;
                    // A search that finds nothing is told apart from a file with no links by the search box
                    if (v.length) {
                        this.empty_text = '';
                    }
                    else {
                        this.empty_text = this.$refs.search.value.trim() ? 'Nothing found' : 'No links yet';
                    }
                },
            });
        },
    });
    app.mixin({methods: {px, pc}});
    app.mount('#app');
}

function px(value)
{
    return value ? `${value}px` : '0';
}

function pc(value)
{
    return value ? `${value*100}%` : '0';
}
</script>

</body>
</html>
