<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Google Chrome Theme | NavPlace</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="/lib/vendor/smcss-2/sm.css" rel="stylesheet">
    <link href="theme.css" rel="stylesheet">
</head>
<body>

<div id="app"></div>

<script src="/lib/vendor/vue-3/vue.global.prod.js"></script>
<script src="/lib/navplace.js"></script>
<script>
main();

function main()
{
    const app = Vue.createApp({
        template: `
            <div class="page">

                <!-- SEARCH -->
                <div class="search-wrap">
                    <div class="search">
                        <!-- magnifier -->
                        <svg viewBox="0 0 24 24">
                            <path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zM10 15a5 5 0 1 1 0-10 5 5 0 0 1 0 10z" />
                        </svg>
                        <input ref="search" />
                    </div>
                </div>

                <!-- SHORTCUTS -->
                <div class="shortcuts">

                    <a v-for="item in items" v-bind:href="item.href" class="tile">
                        <span class="tile-inner">
                            <img v-if="item.icon_url" v-bind:src="item.icon_url" alt="" />
                        </span>
                        <span class="tile-label">{{ item.label }}</span>
                    </a>

                </div>
            </div>
        `,
        data: function () {
            return {items: []};
        },
        mounted: function () {
            navplace({
                input: this.$refs.search,
                update: v => this.items.splice(0, this.items.length, ...v),
            });
        },
    });
    app.mixin({methods: {px, pc}});
    app.mount('#app');
}

function px(value)
{
    return value ? `${value}px` : '0';
}

function pc(value)
{
    return value ? `${value*100}%` : '0';
}
</script>

</body>
</html>
