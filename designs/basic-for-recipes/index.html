<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPlace Recipes</title>
    <script src="/lib/theme_switch.js"></script>
    <style>
        :root {
            --warm-white: #fefaf6;
            --cream: #f7f1eb;
            --soft-beige: #ede4d9;
            --warm-gray: #796c5c;
            --accent-warm: #c67a5d;
            --dark-warm: #5c4d3d;
            --shadow-subtle: 0 4px 12px rgba(92, 77, 61, 0.08);
            --radius-card: 16px;
            --radius-image: 12px;
            --transition-gentle: all 0.3s ease;
            --card-bg: #ffffff;
            --np-scrollbar-thumb: #c9b8a6;
            --np-scrollbar-track: #f7f1eb;
            --np-switch-bg: #f7f1eb;
            --np-switch-fg: #5c4d3d;
            --np-switch-border: #ede4d9;
        }

        /* The kitchen at night: /lib/theme_switch.js sets it and shows the switch */
        :root[data-theme="dark"] {
            --warm-white: #1d1814;
            --cream: #2a231d;
            --soft-beige: #3b3129;
            --warm-gray: #a8998a;
            --accent-warm: #e0937a;
            --dark-warm: #f1e6da;
            --shadow-subtle: 0 4px 12px rgba(0, 0, 0, 0.35);
            --card-bg: #2a231d;
            --np-scrollbar-thumb: #5a4b3e;
            --np-scrollbar-track: #1d1814;
            --np-switch-bg: #2a231d;
            --np-switch-fg: #f1e6da;
            --np-switch-border: #3b3129;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--warm-white);
            color: var(--dark-warm);
            line-height: 1.5;
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .search-container {
            position: sticky;
            top: 20px;
            z-index: 10;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-input {
            width: 100%;
            padding: 18px 24px;
            font-size: 18px;
            background: var(--cream);
            border: 2px solid var(--soft-beige);
            border-radius: 50px;
            color: var(--dark-warm);
            outline: none;
            transition: var(--transition-gentle);
            box-shadow: var(--shadow-subtle);
        }

        .search-input:focus {
            border-color: var(--accent-warm);
            background: var(--card-bg);
        }

        /* The placeholder is never cut: on a narrow screen it shrinks as the box does. Its 43
           characters are about 18.3 font sizes wide and the box holds the screen's width less 125px
           (the page's and its own edges, the corner's theme switch): 5.3vw - 6.7px fits down to 320px */
        .search-input::placeholder {
            color: var(--warm-gray);
            font-size: min(1em, calc(5.3vw - 6.7px));
        }

        .items-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 32px;
            padding-bottom: 60px;
        }

        /* ↑ stops a card below the stuck search box, not under it: where the box sticks (20px), its
           border (2px) and padding (18px) above and below, its line of 18px text (as tall as the
           font makes it: taken as 27px) */
        .recipe-card {
            background: var(--card-bg);
            border-radius: var(--radius-card);
            overflow: hidden;
            transition: var(--transition-gentle);
            box-shadow: var(--shadow-subtle);
            display: flex;
            flex-direction: column;
            height: 100%;
            scroll-margin-top: calc(20px + 2*2px + 2*18px + 27px);
        }

        .recipe-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(92, 77, 61, 0.12);
        }

        /* The link ↑ and ↓ move to (lib/navplace.js): lifted like a card under the mouse, in a warm ring */
        .recipe-card.np-current {
            outline: none;
            transform: translateY(-8px);
            box-shadow: 0 0 0 3px var(--accent-warm), 0 12px 24px rgba(92, 77, 61, 0.12);
        }

        .image-container {
            position: relative;
            padding-top: 66.67%; /* 3:2 aspect ratio */
            overflow: hidden;
            background: var(--soft-beige);
        }

        .recipe-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .recipe-card:hover .recipe-image {
            transform: scale(1.05);
        }

        .recipe-content {
            padding: 24px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .recipe-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 16px;
        }

        .favicon {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            flex-shrink: 0;
            margin-top: 4px;
        }

        /* In place of an icon that did not load: the link's first letter in the same small square */
        .favicon-letter {
            background: var(--soft-beige);
            color: var(--dark-warm);
            font-size: 12px;
            font-weight: 600;
            line-height: 20px;
            text-align: center;
        }

        /* An inline block: the underline of the card, a link, does not reach the letter */
        .favicon-letter span {
            display: inline-block;
        }

        /* A long name wraps inside its card, a word with no spaces too */
        .recipe-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--dark-warm);
            margin-bottom: 4px;
            line-height: 1.3;
            text-decoration: none;
            display: block;
            overflow-wrap: anywhere;
        }

        .recipe-title:hover {
            color: var(--accent-warm);
        }

        .recipe-meta {
            font-size: 14px;
            color: var(--warm-gray);
            margin-bottom: 16px;
        }

        .recipe-description {
            color: var(--dark-warm);
            opacity: 0.85;
            font-size: 15px;
            line-height: 1.5;
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px solid var(--cream);
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 40px;
            color: var(--warm-gray);
        }

        .empty-state h2 {
            font-weight: 400;
            margin-bottom: 12px;
            font-size: 24px;
        }

        .empty-state p {
            font-size: 16px;
            max-width: 400px;
            margin: 0 auto;
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }

            .items-container {
                grid-template-columns: 1fr;
                gap: 24px;
            }

            .search-container {
                margin-bottom: 32px;
            }

            .search-input {
                padding: 16px 20px;
                font-size: 16px;
            }

            /* The search box is lower here: 16px of padding, a line of 16px text (taken as 24px) */
            .recipe-card {
                scroll-margin-top: calc(20px + 2*2px + 2*16px + 24px);
            }
        }

        @media (min-width: 1024px) {
            .items-container {
                grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            }
        }

        /* Under 700px the search box, 600px in the middle, would reach the theme switch in the page's
           corner (/lib/theme_switch.js: 32px, 10px from the edge): the box ends 8px before it */
        @media (max-width: 700px) {
            .search-container {
                margin-right: 34px;
            }
        }

        /* In the desktop app a gear stands before the switch: the box ends before both */
        @media (max-width: 780px) {
            body:has(.np-app-settings) .search-container {
                margin-right: 72px;
            }
        }
    </style>
</head>
<body>
<div class="search-container">
    <input type="search"
           class="search-input"
           placeholder="Find recipes, ingredients, or techniques..."
           autocomplete="off">
</div>

<div class="items-container" id="items-container">
    <div class="empty-state">
        <h2>Your recipe collection</h2>
        <p>Start typing to find your saved recipes and cooking resources</p>
    </div>
</div>

<script src="/lib/navplace.js"></script>
<script>
    main();

    function main()
    {
        const search_input = document.querySelector('.search-input');
        const items_container = document.getElementById('items-container');
        // The links as they are drawn, a card each, in the same order
        let shown_items = [];

        // Pictures and icons that did not load, by address: a card is drawn without its picture,
        // and with the link's first letter in place of its icon
        const failed_urls = new Set();

        // Initialize with empty state
        refresh_items([]);

        if (typeof navplace === 'function') {
            navplace({input: search_input, update: refresh_items});
            // A click on a card opens its link through the runtime: every selected link, the
            // clicked one in place of the last
            items_container.addEventListener('click', function (event) {
                const card = event.target.closest('.recipe-card');
                const item = card ? shown_items[Array.from(items_container.children).indexOf(card)] : null;
                if (item) {
                    navplace.navigate(item, event);
                }
            });
            // A picture or an icon that cannot be loaded never shows as a broken one: the picture
            // leaves its card, the letter takes the icon's place, now and in every later draw.
            // `error` does not bubble: it is caught on its way down
            items_container.addEventListener('error', function (event) {
                const card = event.target.closest('.recipe-card');
                const item = card ? shown_items[Array.from(items_container.children).indexOf(card)] : null;
                if (!item) {
                    return;
                }
                failed_urls.add(event.target.getAttribute('src'));
                if (event.target.matches('.recipe-image')) {
                    event.target.closest('.image-container').remove();
                }
                else if (event.target.matches('.favicon')) {
                    event.target.outerHTML = render_icon_html(item);
                }
            }, true);
        }

        // Fallback for development/demo
        window.navplace_demo = function (items) {
            refresh_items(items);
        };

        function refresh_items(items, {current} = {}) {
            shown_items = items || [];
            if (!items || (items.length === 0)) {
                items_container.innerHTML = `
                        <div class="empty-state">
                            <h2>No recipes found</h2>
                            <p>Try different keywords or browse your collection</p>
                        </div>
                    `;
                return;
            }

            // A link's picture loads only in the desktop app (private://); elsewhere the card has none,
            // as it has none for a picture that failed before
            function has_image(item) {
                return !!item.image_url && (!!window.ElectronApp || !item.image_url.startsWith('private://')) && !failed_urls.has(item.image_url);
            }

            items_container.innerHTML = items.map((item, i) => render_item_html(item, i === current)).join('');

            function render_item_html(item, is_current) {
                return `
                    <a href="${html_escape(item.href)}" class="recipe-card ${is_current ? 'np-current' : ''}" target="_blank">
                        ${has_image(item) ? `<div class="image-container"><img src="${html_escape(item.image_url)}" alt="${html_escape(item.label)}" class="recipe-image"></div>` : ''}
                        <div class="recipe-content">
                            <div class="recipe-header">
                                ${render_icon_html(item)}
                                <div>
                                    <h3 class="recipe-title">${html_escape(item.label)}</h3>
                                    ${item.meta?.domain ? `<div class="recipe-meta">${html_escape(item.meta.domain)}</div>` : ''}
                                </div>
                            </div>
                            ${item.meta?.description ? `<div class="recipe-description">${html_escape(item.meta.description)}</div>` : ''}
                            ${item.meta?.category ? `<div class="recipe-meta">${html_escape(item.meta.category)}</div>` : ''}
                        </div>
                    </a>
                `;
            }
        }

        // The small picture before a recipe's name: the site's icon, or the link's first letter
        // (the first letter or digit of its name, as lib/parse.js picks it for its own tile) when
        // the icon did not load
        function render_icon_html(item) {
            if (!item.icon_url) {
                return '';
            }
            if (failed_urls.has(item.icon_url)) {
                return `<span class="favicon favicon-letter"><span>${html_escape(item.label.match(/[\p{L}\p{N}]/u)?.[0].toUpperCase() ?? '?')}</span></span>`;
            }
            return `<img src="${html_escape(item.icon_url)}" alt="" class="favicon">`;
        }

        // The links file is not trusted: every value from it goes into the HTML through this,
        // an attribute's value too
        function html_escape(text) {
            return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    }
</script>
</body>
</html>
